<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HabIT</title>
    <style>
        /* Mobile-First Base Styles */
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #888;
            --border: #333;
            --highlight: rgba(255, 255, 255, 0.08); 
            --radius: 12px;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            background: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }

        h2, h3 { margin-top: 0; }
        
        /* Top Header Layout */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }

        /* Branding */
        .brand-header {
            color: var(--primary);
            font-size: 1.8em;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            margin: 0;
            cursor: pointer; /* Clickable to open sidebar on desktop */
        }
        .brand-header span { color: var(--text); }
        .brand-icon { margin-right: 5px; font-size: 1.1em; }

        /* Navigation (Icons - Desktop Only, hidden on mobile in favor of sidebar) */
        .desktop-nav { 
            display: none; 
            gap: 8px; 
        }
        .desktop-nav button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .desktop-nav button svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .desktop-nav button.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary);
        }

        /* --- SIDEBAR DRAWER STYLES --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 998;
        }
        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px; /* Hidden offscreen */
            width: 280px;
            height: 100vh;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            z-index: 999;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        .sidebar.open {
            transform: translateX(280px);
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
        }
        
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            padding: 15px 0;
            flex: 1;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1.1em;
            gap: 15px;
        }
        .sidebar-item:hover {
            background: var(--highlight);
        }
        .sidebar-item.active {
            background: rgba(46, 125, 50, 0.2);
            color: var(--primary-light);
            border-left: 4px solid var(--primary);
        }
        .sidebar-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.8em;
            text-align: center;
        }
        /* ----------------------------- */

        /* Containers */
        .tab-content { 
            display: none; 
            background: var(--bg); 
            padding: 0; 
        }
        .tab-content.active { display: block; }

        /* Setup Layouts */
        .panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        /* Forms & Inputs */
        .flex { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        
        input[type="text"], input[type="month"], select { 
            width: 100%;
            padding: 10px; 
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 16px; 
        }
        input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        button.btn { 
            width: 100%;
            padding: 10px 15px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: bold;
        }
        button.btn-danger { background: #d32f2f; }
        button.btn-secondary { background: var(--border); color: var(--text); }
        
        .badge { 
            display: inline-block;
            background: #333; 
            color: #ddd;
            padding: 4px 10px; 
            border-radius: 12px; 
            font-size: 0.85em; 
            margin: 4px 4px 0 0; 
        }

        /* Checkboxes for Setup */
        .assign-cb-wrapper { display: flex; flex-wrap: wrap; gap: 8px; }
        label.checkbox-label {
            display: flex; align-items: center; padding: 6px 10px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 16px; font-size: 0.85em; cursor: pointer;
        }

        /* TRACK HABITS: Weekly Navigator Header */
        .week-navigator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .week-navigator button {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .week-navigator span {
            font-weight: bold;
            font-size: 1em;
        }

        /* TRACK HABITS: Compact Grid Cards */
        .habit-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 10px 16px 10px; 
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        
        .member-card-header {
            text-align: center;
            font-size: 1.05em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        /* The Grid Layout */
        .habit-grid {
            display: grid;
            grid-template-columns: minmax(90px, 2.5fr) repeat(7, 1fr);
            gap: 6px 4px;
            align-items: center;
        }

        .grid-day-name {
            text-align: center;
            font-size: 0.75em;
            color: var(--text-muted);
            font-weight: bold;
            padding: 6px 0;
            border-radius: 6px;
        }
        .grid-day-name.today {
            color: var(--primary-light);
            background: var(--highlight);
        }

        .habit-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 5px;
        }
        .habit-info-title {
            font-size: 0.9em;
            font-weight: bold;
            line-height: 1.2;
            word-wrap: break-word;
        }

        .day-col {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding: 6px 2px;
            border-radius: 6px;
        }
        .day-col.today {
            background: var(--highlight);
        }
        
        .day-box {
            width: 100%;
            max-width: 32px;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            background: var(--bg);
        }
        .day-box.today-box:not(.done) {
            border-color: var(--primary-light); 
        }
        .day-box.done {
            background: var(--primary);
            border-color: var(--primary);
        }
        .day-box.done::after {
            content: '✓';
            color: white;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        /* Grid Separator Line */
        .grid-separator {
            grid-column: 1 / -1;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* REPORTS: Leaderboard Medal Tally */
        .medal-tally-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 25px;
        }
        .medal-tally-header {
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text);
        }
        .medal-tally-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .medal-row {
            display: flex;
            align-items: center;
            background: var(--bg);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid transparent;
        }
        .medal-rank {
            font-size: 1.6em;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }
        .medal-info {
            flex: 1;
        }
        .medal-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        .medal-level {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .medal-xp {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--text);
        }

        /* REPORTS: Individual Cards */
        .report-calendar-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px 15px 25px 15px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }
        .report-calendar-header {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .report-calendar-subheader {
            font-size: 1em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        /* Game XP Bar */
        .xp-bar-container {
            width: 80%;
            max-width: 250px;
            height: 6px;
            background: var(--bg);
            border-radius: 3px;
            margin: 0 auto 20px auto;
            position: relative;
            overflow: hidden;
        }
        .xp-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease-in-out;
        }

        .report-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px 4px;
            margin-bottom: 10px;
        }
        .report-day-name {
            font-size: 0.7em;
            color: var(--text-muted);
            font-weight: bold;
            padding-bottom: 6px;
        }
        .report-day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .report-day-number {
            position: relative;
            z-index: 2;
            font-size: 0.85em;
            color: var(--text);
        }
        .report-day-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background-color: var(--primary-light);
            opacity: 0.8;
            z-index: 1;
            transition: width 0.3s, height 0.3s;
        }
        
        /* Mobile Menu Hamburger */
        .menu-toggle {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-toggle svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        @media (min-width: 600px) {
            body { padding: 20px; }
            .flex { flex-direction: row; align-items: center; }
            input[type="text"], input[type="month"] { flex: 1; }
            button.btn { width: auto; }
            .day-box { max-width: 38px; }
            .menu-toggle { display: none; } /* Hide hamburger on desktop */
            .desktop-nav { display: flex; } /* Show regular nav on desktop */
            .brand-header { cursor: default; }
        }
    </style>
</head>

                Settings & Setup
            </div>
            
            <div style="padding: 20px; margin-top: auto;">
                <p style="font-size: 0.85em; color: var(--text-muted); margin: 0 0 10px 0;">Data Management</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="exportData()" style="flex:1; font-size: 0.9em; padding: 8px;">Export</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('import-file-menu').click()" style="flex:1; font-size: 0.9em; padding: 8px;">Import</button>
                    <input type="file" id="import-file-menu" style="display:none;" accept=".json" onchange="importData(event)">

    <header class="top-header">
        <button class="menu-toggle" onclick="openSidebar()" aria-label="Open Menu">

        </button>
        <h2 class="brand-header" onclick="openSidebar()">🏡 Hab<span>IT</span></h2>
        
        <!-- Desktop Nav remains for wider screens -->
        <nav class="desktop-nav">
            <button onclick="switchTab('log')" id="nav-log" class="active" title="Track">

        <div class="panel">
            <h3 style="font-size:1.1em;">Family Members</h3>
            <div class="flex">
                <input type="text" id="new-member" placeholder="Enter name (e.g., Anantha)">
                <button class="btn" onclick="addMember()">Add</button>
            </div>
            <div id="members-list" class="assign-cb-wrapper"></div>
        </div>

        <div class="panel">
            <h3 style="font-size:1.1em;">Habits</h3>
            <div class="flex">
                <input type="text" id="new-habit" placeholder="Habit name (e.g., Reading)">
            </div>
            <p style="margin: 5px 0 10px; font-size: 0.85em; color: var(--text-muted);">Assign to:</p>
            <div id="habit-assign-members" class="assign-cb-wrapper"></div>

        <div id="habits-list"></div>

    <!-- TRACK HABITS TAB -->
    <div id="log" class="tab-content active">
        
        <div class="week-navigator">
            <button onclick="changeTrackWeek(-1)">&lt;</button>
            <span id="track-week-label">Oct 20 - Oct 26</span>
            <button onclick="changeTrackWeek(1)">&gt;</button>
        </div>

        <div id="daily-log-container"></div>
    </div>

    <!-- REPORTS TAB (Leaderboard) -->
    <div id="reports" class="tab-content">
        <div class="week-navigator" style="margin-bottom: 20px;">
            <button onclick="changeReportMonth(-1)">&lt;</button>
            <span id="report-month-label">October 2026</span>
            <button onclick="changeReportMonth(1)">&gt;</button>
        </div>
            
        <div id="reports-container"></div>
    </div>

    <script>
        // --- Sidebar Logic & Touch Gestures ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        }
        
        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            // Swipe Right to open (only if starting near left edge)
            if (touchendX - touchstartX > SWIPE_THRESHOLD && touchstartX < 50) {
                openSidebar();
            }
            // Swipe Left to close
            if (touchstartX - touchendX > SWIPE_THRESHOLD) {
                closeSidebar();
            }
        }

        // --- Core App Logic ---
        let state = { members: [], habits: [], logs: {} };
        const STORAGE_KEY = 'family_habit_tracker_data';
        const accentColors = ['#b388ff', '#ffb74d', '#81c784', '#4fc3f7', '#f48fb1', '#fff59d'];
        const MAX_DAILY_XP = 100;
        const XP_PER_LEVEL = 500; 

        const today = new Date();
        const getLocalDateStr = (d) => {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const formatMonthDay = d => new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(d);
        
        let currentWeekStart = new Date();
        const day = currentWeekStart.getDay();
        const diffToMonday = currentWeekStart.getDate() - day + (day === 0 ? -6 : 1);
        currentWeekStart.setDate(diffToMonday);
        currentWeekStart.setHours(0,0,0,0);

        let currentReportDate = new Date();
        currentReportDate.setDate(1);

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) state = JSON.parse(data);
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            renderAll();
        }

        function addMember() {
            const input = document.getElementById('new-member');
            const name = input.value.trim();
            if (name && !state.members.includes(name)) {
                state.members.push(name);
                input.value = '';
                saveData();
            }
        }
        function removeMember(name) {
            state.members = state.members.filter(m => m !== name);
            state.habits.forEach(h => h.assignees = h.assignees.filter(m => m !== name));
            saveData();
        }
        function addHabit() {
            const input = document.getElementById('new-habit');
            const name = input.value.trim();
            const checkboxes = document.querySelectorAll('.assign-cb:checked');
            const assignees = Array.from(checkboxes).map(cb => cb.value);

            if (name && assignees.length > 0) {
                state.habits.push({ id: Date.now().toString(), name, assignees });
                input.value = '';
                checkboxes.forEach(cb => cb.checked = false);
                saveData();
            } else {
                alert("Please enter a habit name and select at least one member.");
            }
        }
        function removeHabit(id) {
            state.habits = state.habits.filter(h => h.id !== id);
            saveData();
        }

        function toggleHabitAssignment(habitId, memberName, isAssigned) {
            const habit = state.habits.find(h => h.id === habitId);
            if (habit) {
                if (isAssigned && !habit.assignees.includes(memberName)) {
                    habit.assignees.push(memberName);
                } else if (!isAssigned) {
                    habit.assignees = habit.assignees.filter(m => m !== memberName);
                }
                saveData();
            }
        }

        function exportData() {
            const dataStr = localStorage.getItem(STORAGE_KEY) || JSON.stringify(state);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `HabIT_Backup_${getLocalDateStr(new Date())}.json`;
            a.click();
            URL.revokeObjectURL(url);
            closeSidebar();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.members && importedData.habits && importedData.logs) {
                        state = importedData;
                        saveData();
                        alert("Data imported successfully!");
                    } else {
                        alert("Invalid backup file format.");
                    }
                } catch (err) {
                    alert("Error reading file.");
                }
                event.target.value = ''; 
                closeSidebar();
            };
            reader.readAsText(file);
        }

        function toggleHabitDirect(dateStr, member, habitId, isDone) {
            if (!state.logs[dateStr]) state.logs[dateStr] = {};
            if (!state.logs[dateStr][member]) state.logs[dateStr][member] = {};
            
            if (isDone) {
                state.logs[dateStr][member][habitId] = true;
            } else {
                delete state.logs[dateStr][member][habitId];
                if (Object.keys(state.logs[dateStr][member]).length === 0) delete state.logs[dateStr][member];
                if (Object.keys(state.logs[dateStr]).length === 0) delete state.logs[dateStr];
            }
            saveData();
        }

        function changeTrackWeek(offset) {
            currentWeekStart.setDate(currentWeekStart.getDate() + (offset * 7));
            renderLog();
        }

        function changeReportMonth(offset) {
            currentReportDate.setMonth(currentReportDate.getMonth() + offset);
            renderReports();
        }

        function switchTab(tabId) {
            // Content Tabs
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // Desktop Nav
            document.querySelectorAll('.desktop-nav button').forEach(b => b.classList.remove('active'));
            if(document.getElementById('nav-' + tabId)) document.getElementById('nav-' + tabId).classList.add('active');
            
            // Sidebar Nav
            document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
            if(document.getElementById('menu-' + tabId)) document.getElementById('menu-' + tabId).classList.add('active');

            closeSidebar();
            renderAll();
        }

        function renderAll() {
            renderSetup();
            renderLog();
            renderReports();
        }

        function renderSetup() {
            const mList = document.getElementById('members-list');
            mList.innerHTML = state.members.map(m => 
                `<span class="badge">${m} <button onclick="removeMember('${m}')" style="border:none; background:none; color:red; cursor:pointer; font-size:1.2em; padding:0 0 0 5px;">&times;</button></span>`
            ).join('');

            const assignBox = document.getElementById('habit-assign-members');
            assignBox.innerHTML = state.members.map(m => 
                `<label class="checkbox-label"><input type="checkbox" class="assign-cb" value="${m}" style="transform: scale(1.2); margin-right: 6px;"> ${m}</label>`
            ).join('');

            const hList = document.getElementById('habits-list');
            hList.innerHTML = state.habits.map(h => `
                <div class="panel habit-row" style="display:flex; flex-direction:column; margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 8px;">
                        <strong style="font-size:0.95em;">${h.name}</strong>
                        <button class="btn btn-danger" style="width:auto; padding:4px 10px; font-size:0.8em;" onclick="removeHabit('${h.id}')">Delete</button>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:6px;">
                        ${state.members.map(m => `
                            <label class="checkbox-label" style="padding: 4px 8px; font-size: 0.8em; ${h.assignees.includes(m) ? 'border-color: var(--primary); background: var(--highlight);' : ''}">
                                <input type="checkbox" style="transform: scale(1.1); margin-right: 4px;" ${h.assignees.includes(m) ? 'checked' : ''} onchange="toggleHabitAssignment('${h.id}', '${m}', this.checked)"> ${m}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderLog() {
            const container = document.getElementById('daily-log-container');
            
            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() + i);
                days.push(d);
            }
            
            document.getElementById('track-week-label').innerText = `${formatMonthDay(days[0])} - ${formatMonthDay(days[6])}`;

            if (state.members.length === 0) {
                container.innerHTML = "<p>Please add members and habits in the Setup tab.</p>";
                return;
            }

            let html = '';
            let habitsFound = false;
            let isFirstMemberWithHabits = true;
            const dayNames = ['M', 'Tu', 'W', 'Th', 'F', 'Sa', 'Su'];
            const todayStr = getLocalDateStr(new Date());

            state.members.forEach((member, memberIndex) => {
                const memberHabits = state.habits.filter(h => h.assignees.includes(member));
                if (memberHabits.length > 0) {
                    habitsFound = true;
                    const cardAccent = accentColors[memberIndex % accentColors.length];
                    
                    html += `<div class="habit-card" style="border: 1px solid ${cardAccent};">`;
                    html += `<div class="member-card-header" style="color: ${cardAccent};">${member}</div>`;
                    html += `<div class="habit-grid">`;
                    
                    if (isFirstMemberWithHabits) {
                        html += `<div></div>`;
                        days.forEach((day, dayIndex) => {
                            const isToday = getLocalDateStr(day) === todayStr;
                            html += `<div class="grid-day-name ${isToday ? 'today' : ''}">${dayNames[dayIndex]}</div>`;
                        });
                        isFirstMemberWithHabits = false;
                    }

                    memberHabits.forEach((h, index) => {
                        html += `
                            <div class="habit-info">
                                <div class="habit-info-title">${h.name}</div>
                            </div>
                        `;
                        
                        days.forEach((day) => {
                            const dateStr = getLocalDateStr(day);
                            const isDone = state.logs[dateStr]?.[member]?.[h.id] || false;
                            const isToday = dateStr === todayStr;

                            html += `
                                <div class="day-col ${isToday ? 'today' : ''}" onclick="toggleHabitDirect('${dateStr}', '${member}', '${h.id}', ${!isDone})">
                                    <div class="day-box ${isDone ? 'done' : ''} ${isToday ? 'today-box' : ''}">
                                        ${!isDone ? `<span style="color: var(--text-muted); font-size: 0.85em; opacity: 0.5;">${day.getDate()}</span>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                        
                        if (index < memberHabits.length - 1) {
                            html += `<div class="grid-separator"></div>`;
                        }
                    });
                    
                    html += `</div></div>`;
                }
            });
            
            if (!habitsFound) {
                 html = "<p style='color: var(--text-muted); font-size:0.9em;'>No habits assigned. Go to Setup.</p>";
            }
            
            container.innerHTML = html;
        } 

        function renderReports() {
            const container = document.getElementById('reports-container');
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            const year = currentReportDate.getFullYear();
            const monthIndex = currentReportDate.getMonth();
            const monthStr = String(monthIndex + 1).padStart(2, '0');
            const monthPrefix = `${year}-${monthStr}`;
            
            document.getElementById('report-month-label').innerText = `${monthNames[monthIndex]} ${year}`;

            if (state.members.length === 0) {
                container.innerHTML = "<p>Please add members and habits in the Setup tab.</p>";
                return;
            }

            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            const firstDay = new Date(year, monthIndex, 1).getDay(); 
            const firstDayShifted = firstDay === 0 ? 6 : firstDay - 1; 

            const dayNamesHeader = `
                <div class="report-day-name">Mon</div>
                <div class="report-day-name">Tue</div>
                <div class="report-day-name">Wed</div>
                <div class="report-day-name">Thu</div>
                <div class="report-day-name">Fri</div>
                <div class="report-day-name">Sat</div>
                <div class="report-day-name">Sun</div>
            `;

            let memberStats = [];

            state.members.forEach((member, memberIndex) => {
                const memberHabits = state.habits.filter(h => h.assignees.includes(member));
                if (memberHabits.length === 0) return;

                let totalCompleted = 0;
                let gridHtml = '';
                
                for (let i = 0; i < firstDayShifted; i++) {
                    gridHtml += `<div></div>`;
                }

                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${monthPrefix}-${i.toString().padStart(2, '0')}`;
                    let dayCompleted = 0;
                    let dayExpected = memberHabits.length;

                    if (state.logs[dateStr] && state.logs[dateStr][member]) {
                        memberHabits.forEach(h => {
                            if (state.logs[dateStr][member][h.id]) {
                                dayCompleted++;
                                totalCompleted++;
                            }
                        });
                    }

                    const dayScore = dayExpected === 0 ? 0 : (dayCompleted / dayExpected);
                    const circleSize = dayScore > 0 ? (dayScore * 90) + 10 : 0; 
                    const textColor = dayScore > 0.6 ? '#121212' : 'var(--text)'; 
                    
                    const cardAccent = accentColors[memberIndex % accentColors.length];

                    gridHtml += `
                        <div class="report-day-cell">
                            <div class="report-day-circle" style="background-color: ${cardAccent}; width: ${circleSize}%; height: ${circleSize}%;"></div>
                            <span class="report-day-number" style="color: ${textColor};">${i}</span>
                        </div>
                    `;
                }
                
                const totalXP = memberHabits.length > 0 ? Math.round((totalCompleted / memberHabits.length) * MAX_DAILY_XP) : 0;
                const currentLevel = Math.floor(totalXP / XP_PER_LEVEL) + 1;
                const progressToNextLevel = ((totalXP % XP_PER_LEVEL) / XP_PER_LEVEL) * 100;

                memberStats.push({
                    name: member,
                    originalIndex: memberIndex,
                    xp: totalXP,
                    level: currentLevel,
                    progress: progressToNextLevel,
                    gridHtml: gridHtml
                });
            });

            memberStats.sort((a, b) => b.xp - a.xp);

            let html = `
                <div class="medal-tally-container">
                    <div class="medal-tally-header">🏆 Monthly Leaderboard</div>
                    <div class="medal-tally-grid">
            `;

            memberStats.forEach((stat, rankIndex) => {
                const cardAccent = accentColors[stat.originalIndex % accentColors.length];
                let rankIcon = '';
                if (rankIndex === 0) rankIcon = '🥇';
                else if (rankIndex === 1) rankIcon = '🥈';
                else if (rankIndex === 2) rankIcon = '🥉';
                else rankIcon = `<span style="font-size:0.9em; color:var(--text-muted);">${rankIndex + 1}</span>`;

                html += `
                    <div class="medal-row" style="border-left-color: ${cardAccent};">
                        <div class="medal-rank">${rankIcon}</div>
                        <div class="medal-info">
                            <div class="medal-name" style="color: ${cardAccent};">${stat.name}</div>
                            <div class="medal-level">Level ${stat.level}</div>
                        </div>
                        <div class="medal-xp">⭐ ${stat.xp}</div>
                    </div>
                `;
            });
            html += `</div></div>`;

            memberStats.forEach((stat, rankIndex) => {
                const cardAccent = accentColors[stat.originalIndex % accentColors.length];
                
                html += `
                    <div class="report-calendar-card" style="border: 1px solid ${cardAccent};">
                        <div class="report-calendar-header" style="color: ${cardAccent};">
                            ${stat.name}
                        </div>
                        
                        <div class="report-calendar-subheader">
                            <span>⭐ <strong style="color:${cardAccent};">${stat.xp}</strong> XP</span>
                            <span style="color: var(--border);">|</span>
                            <span>🏅 Level <strong style="color:white;">${stat.level}</strong></span>
                        </div>
                        
                        <div class="xp-bar-container">
                            <div class="xp-bar-fill" style="width: ${stat.progress}%; background-color: ${cardAccent};"></div>
                        </div>
                        
                        <div class="report-calendar-grid">
                            ${dayNamesHeader}
                            ${stat.gridHtml}
                        </div>
                    </div>
                `;
            });
            
            if (memberStats.length === 0) {
                 html = "<p style='color: var(--text-muted);'>No habits assigned. Go to Setup.</p>";
            }

            container.innerHTML = html;
        }

        // Initialize
        loadData();
        renderAll();
    </script>
</body>
</html>
