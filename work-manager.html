function saveSubtaskForm(e, taskId, subId) {
  e.preventDefault();
  const t = getTask(taskId);
  if (!t) return;
  if (!t.subtasks) t.subtasks = [];
  const payload = {
    title: document.getElementById('stTitle').value.trim(),
    assignee: (document.getElementById('stAssignee')?.value || '').trim(),
    description: sanitizeNoteHtml(document.getElementById('stDesc')?.innerHTML || ''),
    status: document.getElementById('stStatus').value,
    category: document.getElementById('stCategory').value,
    dueDate: document.getElementById('stDue').value,
    plannedDate: document.getElementById('stPlannedDate').value,
    plannedStartTime: document.getElementById('stPlannedTime').value,
    estimatedHours: Number(document.getElementById('stEstHours').value || 0),
    externalRef: (document.getElementById('stExternalRef')?.value || '').trim(),
    blockedByTaskId: document.getElementById('stBlockedBy')?.value || '',
    learningProgress: Number(document.getElementById('stLearningProgress')?.value || 0)
  };
  if (subId) {
    const existing = t.subtasks.find(x => x.id === subId);
    const wasDone = existing.status === 'Done';
    Object.assign(existing, payload);
    if (!wasDone && existing.status === 'Done') maybeAutoNotifySlack(t, existing, 'completed');
    showToast('Subtask updated');
  } else {
    const createdSub = { id: uid('sub'), ...payload };
    t.subtasks.push(createdSub);
    maybeAutoNotifySlack(t, createdSub, 'created');
    showToast('Subtask added');
  }
  if (payload.assignee) ensureAssigneeRecord(payload.assignee);
  saveState();
  closeModal();
  render();
}

function deleteSubtask(taskId, subId) {
  const t = getTask(taskId);
  if (!t) return;
  if (state.activeTimer && state.activeTimer.taskId === taskId && state.activeTimer.subtaskId === subId) {
    stopActiveTimer(true);
  }
  t.subtasks = (t.subtasks || []).filter(s => s.id !== subId);
  saveState();
  render();
  showToast('Subtask deleted');
}

function openMoveSubtaskModal(taskId, subId) {
  const parentTask = getTask(taskId);
  if (!parentTask) return;
  const sub = (parentTask.subtasks || []).find(s => s.id === subId);
  if (!sub) return;
  const activeProjects = state.projects.filter(p => !p.archived);
  if (activeProjects.length === 0) {
    alert('Create a project first before moving this item.');
    return;
  }
  const defaultProjId = activeProjects[0].id;
  openModal(`
    <div class="modal-header">
      <h3>📁 Move to Project</h3>
      <button class="btn btn-xs btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <p class="field-hint" style="margin-bottom:12px;">
      Move <strong>${esc(sub.title)}</strong> out of <em>${esc(parentTask.title)}</em> so it lives permanently as its own task under the chosen project.
    </p>
    <form onsubmit="executeMoveSubtask(event, '${taskId}', '${subId}')">
      <div class="form-row">
        <div class="form-group">
          <label>Target Project *</label>
          <select id="mvProject" required onchange="populateMoveStageDropdown(this.value)">
            ${activeProjects.map(p => `<option value="${p.id}" ${p.id === defaultProjId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Stage (optional)</label>
          <select id="mvStage"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Move to Project</button>
      </div>
    </form>
  `);
  populateMoveStageDropdown(defaultProjId);
}

function populateMoveStageDropdown(projectId) {
  const proj = getProject(projectId);
  const sel = document.getElementById('mvStage');
  if (!sel) return;
  const stages = proj?.stages || [];
  sel.innerHTML = `<option value="">None</option>` + stages.map(s =>
    `<option value="${s.id}">${esc(s.name)}</option>`
  ).join('');
}

function executeMoveSubtask(e, taskId, subId) {
  e.preventDefault();
  const parentTask = getTask(taskId);
  if (!parentTask) return;
  const subIdx = (parentTask.subtasks || []).findIndex(s => s.id === subId);
  if (subIdx === -1) return;
  const sub = parentTask.subtasks[subIdx];
  const targetProjectId = document.getElementById('mvProject').value;
  const targetStageId = document.getElementById('mvStage').value;

  const newTaskId = uid('task');
  const isCalendarEventItem = Boolean(parentTask.isCalendarInbox || sub.icsUid);
  const newTask = {
    id: newTaskId,
    projectId: targetProjectId,
    stageId: targetStageId,
    title: sub.title,
    assignee: sub.assignee || '',
    description: sub.description || '',
    dueDate: isCalendarEventItem ? '' : (sub.dueDate || ''),
    priority: 'Medium',
    status: sub.status || 'To do',
    billableOverride: 'inherit',
    category: sub.category || 'Administrative',
    externalRef: sub.externalRef || '',
    blockedByTaskId: sub.blockedByTaskId || '',
    learningProgress: Number(sub.learningProgress || 0),
    plannedDate: sub.plannedDate || '',
    plannedStartTime: sub.plannedStartTime || '',
    estimatedHours: Number(sub.estimatedHours || 0),
    icsUid: sub.icsUid || '',
    subtasks: []
  };

  // Re-link any existing time entries or active timer from the subtask to the new task
  state.timeEntries.forEach(entry => {
    if (entry.taskId === taskId && entry.subtaskId === subId) {
      entry.projectId = targetProjectId;
      entry.taskId = newTaskId;
      entry.subtaskId = null;
    }
  });
  if (state.activeTimer && state.activeTimer.taskId === taskId && state.activeTimer.subtaskId === subId) {
    state.activeTimer.taskId = newTaskId;
    state.activeTimer.subtaskId = null;
  }

  parentTask.subtasks.splice(subIdx, 1);
  state.tasks.unshift(newTask);
  saveState();
  closeModal();
  render();
  const proj = getProject(targetProjectId);
  showToast(`Moved to ${proj ? proj.name : 'project'}`);
}

function saveAssigneeForm(e, assigneeId) {
  e.preventDefault();
  const newName = (document.getElementById('asgName')?.value || '').trim();
  const team = (document.getElementById('asgTeam')?.value || '').trim();
  const email = (document.getElementById('asgEmail')?.value || '').trim();
  const leftOrg = Boolean(document.getElementById('asgLeftOrg')?.checked);

  if (!newName) return;

  const duplicate = state.assignees.find(x => x.id !== assigneeId && (x.name || '').trim().toLowerCase() === newName.toLowerCase());
  if (duplicate) {
    alert(`An assignee named "${duplicate.name}" already exists.`);
    return;
  }

  if (assigneeId) {
    const existing = state.assignees.find(x => x.id === assigneeId);
    if (!existing) return;
    const oldName = (existing.name || '').trim();
    if (oldName && oldName !== newName) {
      // Cascade rename across all tasks, subtasks, and active filters
      state.tasks.forEach(t => {
        if ((t.assignee || '').trim().toLowerCase() === oldName.toLowerCase()) t.assignee = newName;
        (t.subtasks || []).forEach(s => {
          if ((s.assignee || '').trim().toLowerCase() === oldName.toLowerCase()) s.assignee = newName;
        });
      });
      if (Array.isArray(state.ui.taskFilters.assignees)) {
        state.ui.taskFilters.assignees = state.ui.taskFilters.assignees.map(x => x.toLowerCase() === oldName.toLowerCase() ? newName : x);
      }
    }
    existing.name = newName;
    existing.team = team;
    existing.email = email;
    existing.leftOrg = leftOrg;
    showToast('Assignee updated');
  } else {
    state.assignees.push({ id: uid('asg'), name: newName, team, email, leftOrg });
    showToast('Assignee added');
  }
  saveState();
  closeModal();
  render();
}

function toggleAssigneeLeftOrg(assigneeId) {
  const a = state.assignees.find(x => x.id === assigneeId);
  if (!a) return;
  a.leftOrg = !a.leftOrg;
  saveState();
  render();
  showToast(a.leftOrg ? `${a.name} marked as left organisation` : `${a.name} restored as active`);
}

function deleteAssigneeRecord(assigneeId) {
  const a = state.assignees.find(x => x.id === assigneeId);
  if (!a) return;
  const st = computeAssigneeStats(n => n.toLowerCase() === a.name.toLowerCase(), todayStr());
  const msg = st.total > 0
    ? `Remove "${a.name}" from the directory and unassign their ${st.total} task(s)/subtask(s) back to Me?`
    : `Remove "${a.name}" from the directory?`;
  if (!confirm(msg)) return;
  if (st.total > 0) {
    state.tasks.forEach(t => {
      if ((t.assignee || '').trim().toLowerCase() === a.name.toLowerCase()) t.assignee = '';
      (t.subtasks || []).forEach(s => {
        if ((s.assignee || '').trim().toLowerCase() === a.name.toLowerCase()) s.assignee = '';
      });
    });
  }
  state.assignees = state.assignees.filter(x => x.id !== assigneeId);
  if (Array.isArray(state.ui.taskFilters.assignees)) {
    state.ui.taskFilters.assignees = state.ui.taskFilters.assignees.filter(x => x.toLowerCase() !== a.name.toLowerCase());
  }
  saveState();
  render();
  showToast('Assignee removed');
}

function formatRichEditor(editorId, type) {
  const editor = document.getElementById(editorId);
  if (!editor) return;
  editor.focus();
  if (type === 'bold') document.execCommand('bold', false, null);
  if (type === 'italic') document.execCommand('italic', false, null);
  if (type === 'underline') document.execCommand('underline', false, null);
  if (type === 'list') document.execCommand('insertUnorderedList', false, null);
  if (type === 'olist') document.execCommand('insertOrderedList', false, null);
  if (type === 'heading') document.execCommand('formatBlock', false, 'h3');
}

function formatNote(type) {
  formatRichEditor('nBody', type);
}

function saveNoteForm(e, noteId) {
  e.preventDefault();
  const tags = document.getElementById('nTags').value
    .split(',')
    .map(x => x.trim())
    .filter(Boolean);
  const payload = {
    title: document.getElementById('nTitle').value.trim(),
    projectId: document.getElementById('nProject').value,
    taskId: document.getElementById('nTask').value,
    tags,
    body: sanitizeNoteHtml(document.getElementById('nBody').innerHTML)
  };
  if (noteId) {
    const n = state.notes.find(x => x.id === noteId);
    Object.assign(n, payload);
    showToast('Note updated');
  } else {
    state.notes.unshift({ id: uid('note'), createdAt: new Date().toISOString(), ...payload });
    showToast('Note saved');
  }
  saveState();
  closeModal();
  render();
}

function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  state.notes = state.notes.filter(n => n.id !== id);
  saveState();
  render();
  showToast('Note deleted');
}

function saveTimeEntryForm(ev, entryId) {
  ev.preventDefault();
  const taskId = document.getElementById('teTask').value;
  const subtaskId = document.getElementById('teSubtask').value || null;
  const task = getTask(taskId);
  const hrs = Number(document.getElementById('teHours').value || 0);
  const mins = Number(document.getElementById('teMins').value || 0);
  const totalSec = Math.round(hrs * 3600 + mins * 60);
  if (totalSec <= 0) {
    alert('Please enter a duration greater than 0.');
    return;

  let category = task ? task.category : 'Administrative';
  if (task && subtaskId) {
    const sub = (task.subtasks || []).find(s => s.id === subtaskId);
    if (sub && sub.category) category = sub.category;
  }

  const payload = {
    projectId: task ? task.projectId : '',
    taskId,
    subtaskId,
    category,
    billable: document.getElementById('teBillable').value === 'true',
    date: document.getElementById('teDate').value,
    durationSeconds: totalSec,
    note: document.getElementById('teNote').value.trim()
  };

  if (entryId) {

    Object.assign(existing, payload);
    showToast('Time entry updated');
  } else {
    state.timeEntries.unshift({ id: uid('time'), ...payload });
    showToast('Time entry added');
  }
  saveState();
  closeModal();
  render();
}

function adjustQuickLogMins(delta) {
  const hEl = document.getElementById('qlHours');
  const mEl = document.getElementById('qlMins');
  if (!hEl || !mEl) return;
  let total = (Number(hEl.value || 0) * 60) + Number(mEl.value || 0) + delta;
  if (total < 5) total = 5;
  hEl.value = Math.floor(total / 60);
  mEl.value = total % 60;
}

function saveQuickLogActual(e, taskId, subtaskId) {
  e.preventDefault();
  const t = getTask(taskId);
  if (!t) return;
  const sub = subtaskId ? (t.subtasks || []).find(s => s.id === subtaskId) : null;
  const hrs = Number(document.getElementById('qlHours').value || 0);
  const mins = Number(document.getElementById('qlMins').value || 0);
  const totalSec = Math.round(hrs * 3600 + mins * 60);
  if (totalSec <= 0) {
    alert('Please enter an actual duration greater than 0.');
    return;
  }

  const category = (sub && sub.category) ? sub.category : t.category;
  state.timeEntries.unshift({
    id: uid('time'),
    projectId: t.projectId,
    taskId: t.id,
    subtaskId: subtaskId || null,
    category,
    billable: document.getElementById('qlBillable').value === 'true',
    date: document.getElementById('qlDate').value || todayStr(),
    durationSeconds: totalSec,
    note: document.getElementById('qlNote').value.trim()
  });

  if (document.getElementById('qlMarkDone')?.checked) {
    if (sub) sub.status = 'Done';
    else {
      const wasDone = t.status === 'Done';
      t.status = 'Done';
      if (!wasDone) spawnNextRecurringTask(t);
    }
  }

  saveState();
  closeModal();
  render();
  showToast(`Logged ${formatDuration(totalSec)} as actual time`);
}

// ===================== 6. REPORTS VIEW =====================
function getReportDateBounds() {
  const now = new Date();
  const mode = state.ui.reportRange;
  if (mode === 'week') {
    const day = now.getDay(); // 0=Sun
    const diffToMon = (day === 0 ? -6 : 1 - day);
    const start = new Date(now);
    start.setDate(now.getDate() + diffToMon);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return {
      start: formatLocalDate(start),
      end: formatLocalDate(end)
    };
  }
  if (mode === 'month') {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return {
      start: formatLocalDate(start),
      end: formatLocalDate(end)
    };
  }
  if (mode === 'custom') {
    return {
      start: state.ui.reportStart || addDaysStr(-14),
      end: state.ui.reportEnd || todayStr()
    };
  }
  return { start: '0000-01-01', end: '9999-12-31' };
}

function renderReports(el) {
  const bounds = getReportDateBounds();
  const entries = state.timeEntries.filter(e => e.date >= bounds.start && e.date <= bounds.end);

  const totalSec = entries.reduce((s, e) => s + (e.durationSeconds || 0), 0);
  const billableSec = entries.filter(e => e.billable).reduce((s, e) => s + (e.durationSeconds || 0), 0);
  const nonBillableSec = totalSec - billableSec;
  const billPct = totalSec > 0 ? Math.round((billableSec / totalSec) * 100) : 0;

  // By Project & earnings
  const byProject = {};
  let totalEarned = 0;
  entries.forEach(e => {
    const p = getProject(e.projectId);
    const key = e.projectId || 'unknown';
    if (!byProject[key]) {
      byProject[key] = { name: p ? p.name : 'Unknown Project', sec: 0, billSec: 0, rate: p && p.billable ? Number(p.hourlyRate || 0) : 0 };
    }
    byProject[key].sec += (e.durationSeconds || 0);
    if (e.billable) byProject[key].billSec += (e.durationSeconds || 0);
  });
  const projRows = Object.values(byProject).map(r => {
    const earned = (r.billSec / 3600) * r.rate;
    totalEarned += earned;
    return { ...r, earned };
  }).sort((a, b) => b.sec - a.sec);

  // By Category
  const byCategory = {};
  getCategories().forEach(c => byCategory[c] = 0);
  entries.forEach(e => {
    byCategory[e.category] = (byCategory[e.category] || 0) + (e.durationSeconds || 0);
  });
  const catRows = Object.entries(byCategory).map(([name, sec]) => ({ name, sec })).sort((a, b) => b.sec - a.sec);

  // By Day
  const byDay = {};
  entries.forEach(e => {
    byDay[e.date] = (byDay[e.date] || 0) + (e.durationSeconds || 0);
  });
  const dayRows = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0]));
  const maxDaySec = Math.max(1, ...dayRows.map(d => d[1]));

  // Planned vs Actual for tasks & subtasks within date bounds
  const pvaRows = [];
  state.tasks.forEach(t => {
    const inRange = t.plannedDate && t.plannedDate >= bounds.start && t.plannedDate <= bounds.end;
    const actSec = getActualSecondsForTask(t.id, false);
    if (inRange || (state.ui.reportRange === 'all' && (t.estimatedHours > 0 || actSec > 0))) {
      pvaRows.push({
        type: 'Task',
        name: t.title,
        project: getProject(t.projectId)?.name || '',
        plannedDate: t.plannedDate || '—',
        estHrs: Number(t.estimatedHours || 0),
        actHrs: actSec / 3600
      });
    }
    (t.subtasks || []).forEach(sub => {
      const subInRange = sub.plannedDate && sub.plannedDate >= bounds.start && sub.plannedDate <= bounds.end;
      const subActSec = getActualSecondsForSubtask(t.id, sub.id);
      if (subInRange || (state.ui.reportRange === 'all' && (sub.estimatedHours > 0 || subActSec > 0))) {
        pvaRows.push({
          type: 'Subtask',
          name: `${t.title} → ${sub.title}`,
          project: getProject(t.projectId)?.name || '',
          plannedDate: sub.plannedDate || '—',
          estHrs: Number(sub.estimatedHours || 0),
          actHrs: subActSec / 3600
        });
      }
    });
  });

  // Donut SVG math
  const r = 46;
  const circ = 2 * Math.PI * r;
  const billDash = totalSec > 0 ? (billableSec / totalSec) * circ : 0;

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;" class="no-print">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <div class="tab-switch">
          <button class="tab-btn ${state.ui.reportRange === 'week' ? 'active' : ''}" onclick="state.ui.reportRange='week';render()">This Week</button>
          <button class="tab-btn ${state.ui.reportRange === 'month' ? 'active' : ''}" onclick="state.ui.reportRange='month';render()">This Month</button>
          <button class="tab-btn ${state.ui.reportRange === 'all' ? 'active' : ''}" onclick="state.ui.reportRange='all';render()">All Time</button>
          <button class="tab-btn ${state.ui.reportRange === 'custom' ? 'active' : ''}" onclick="state.ui.reportRange='custom';render()">Custom</button>
        </div>
        ${state.ui.reportRange === 'custom' ? `
          <input type="date" style="width:auto;" value="${bounds.start}" onchange="state.ui.reportStart=this.value;render()" />
          <span>to</span>
          <input type="date" style="width:auto;" value="${bounds.end}" onchange="state.ui.reportEnd=this.value;render()" />
        ` : `<span style="font-size:0.82rem;color:var(--text-muted)">${state.ui.reportRange === 'all' ? 'All recorded dates' : `${bounds.start} to ${bounds.end}`}</span>`}
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="exportReportCSV()">📥 Export CSV</button>
        <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save as PDF</button>
      </div>
    </div>

    <div class="grid-4" style="margin-bottom:18px;">
      <div class="kpi-card">
        <div class="kpi-label">Total Hours</div>
        <div class="kpi-value">${(totalSec / 3600).toFixed(2)}h</div>
        <div class="kpi-sub">${entries.length} time entries</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Billable Hours</div>
        <div class="kpi-value" style="color:var(--success)">${(billableSec / 3600).toFixed(2)}h</div>
        <div class="kpi-sub">${billPct}% of total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Non-billable Hours</div>
        <div class="kpi-value">${(nonBillableSec / 3600).toFixed(2)}h</div>
        <div class="kpi-sub">${totalSec > 0 ? 100 - billPct : 0}% of total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Estimated Earned</div>
        <div class="kpi-value" style="color:var(--primary)">$${totalEarned.toFixed(2)}</div>
        <div class="kpi-sub">From billable projects with rates</div>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:18px;">
      <div class="card">
        <div class="card-header"><div class="card-title">Billable vs Non-billable</div></div>

function exportReportCSV() {
  const bounds = getReportDateBounds();
  const entries = state.timeEntries.filter(e => e.date >= bounds.start && e.date <= bounds.end);
  const rows = [['Date', 'Project', 'Task', 'Subtask', 'Category', 'Billable', 'Hours', 'Hourly Rate', 'Estimated Earned', 'Note']];
  entries.forEach(e => {
    const p = getProject(e.projectId);
    const t = getTask(e.taskId);
    const sub = (t && e.subtaskId) ? (t.subtasks || []).find(s => s.id === e.subtaskId) : null;
    const hrs = (e.durationSeconds || 0) / 3600;
    const rate = (e.billable && p && p.billable) ? Number(p.hourlyRate || 0) : 0;
    const earned = hrs * rate;
    rows.push([
      e.date,
      p ? p.name : '',
      t ? t.title : '',
      sub ? sub.title : '',
      e.category,
      e.billable ? 'Yes' : 'No',
      hrs.toFixed(2),
      rate.toFixed(2),
      earned.toFixed(2),
      e.note || ''
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workflow-report-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('CSV report downloaded');
}


// ===================== 7. CALENDAR VIEW & ICS =====================
function getCalendarDateObj() {
  if (!state.ui.calendarDate) state.ui.calendarDate = todayStr();
  const [y, m, d] = state.ui.calendarDate.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function shiftCalendar(dir) {
  const d = getCalendarDateObj();
  if (state.ui.calendarMode === 'month') {
    d.setMonth(d.getMonth() + dir);
  } else if (state.ui.calendarMode === 'week') {
    d.setDate(d.getDate() + dir * 7);
  } else {
    d.setDate(d.getDate() + dir);
  }
  state.ui.calendarDate = formatLocalDate(d);
  render();
}

function jumpCalendarToday() {
  state.ui.calendarDate = todayStr();
  render();
}

function collectCalendarItemsForDate(dateStr) {
  const items = [];
  // Planned tasks & subtasks
  state.tasks.forEach(t => {
    if (t.plannedDate === dateStr) {
      items.push({
        kind: 'planned-task',
        taskId: t.id,
        subtaskId: null,
        title: t.title,
        time: t.plannedStartTime || '',
        estHours: Number(t.estimatedHours || 0),
        status: t.status
      });
    }
    if (t.dueDate === dateStr) {
      items.push({
        kind: 'due-task',
        taskId: t.id,
        subtaskId: null,
        title: t.title,
        time: '',
        status: t.status
      });
    }
    (t.subtasks || []).forEach(sub => {
      if (sub.plannedDate === dateStr) {
        items.push({
          kind: 'planned-subtask',
          taskId: t.id,
          subtaskId: sub.id,
          title: `${t.title} → ${sub.title}`,
          shortTitle: sub.title,
          time: sub.plannedStartTime || '',
          estHours: Number(sub.estimatedHours || 0),
          status: sub.status
        });
      }
    });
  });

  // Time entries
  state.timeEntries.forEach(e => {
    if (e.date === dateStr) {
      const t = getTask(e.taskId);
      items.push({
        kind: 'time-entry',
        entryId: e.id,
        taskId: e.taskId || null,
        subtaskId: e.subtaskId || null,
        title: `${formatDuration(e.durationSeconds)} • ${t ? t.title : 'Logged time'}`,
        time: ''
      });
    }
  });

  // Imported ICS events
  (state.calendarEvents || []).forEach(ev => {
    if (ev.date === dateStr) {
      items.push({
        kind: 'ics-event',
        eventId: ev.id,
        title: ev.title,
        time: ev.startTime || '',
        endTime: ev.endTime || '',
        description: ev.description || ''
      });
    }
  });

  return items;
}

function renderCalendar(el) {
  const cur = getCalendarDateObj();
  const mode = state.ui.calendarMode || 'month';
  let rangeLabel = '';
  if (mode === 'month') {
    rangeLabel = cur.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  } else if (mode === 'week') {
    const day = cur.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(cur); mon.setDate(cur.getDate() + diff);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    rangeLabel = `${mon.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${sun.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
  } else {
    rangeLabel = cur.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  // Build draggable tray of active tasks & subtasks
  const trayItems = [];
  state.tasks.filter(t => t.status !== 'Done').forEach(t => {
    trayItems.push({ type: 'task', taskId: t.id, subtaskId: null, title: t.title, meta: t.plannedDate ? `Planned ${t.plannedDate}` : (t.dueDate ? `Due ${t.dueDate}` : 'Unscheduled') });
    (t.subtasks || []).filter(s => s.status !== 'Done').forEach(s => {
      trayItems.push({ type: 'subtask', taskId: t.id, subtaskId: s.id, title: `↳ ${s.title}`, parentTitle: t.title, meta: s.plannedDate ? `Planned ${s.plannedDate}` : 'Unplanned subtask' });
    });
  });

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm" onclick="shiftCalendar(-1)">◀</button>
        <button class="btn btn-sm" onclick="jumpCalendarToday()">Today</button>
        <button class="btn btn-sm" onclick="shiftCalendar(1)">▶</button>
        <strong style="font-size:1.05rem;margin-left:6px;">${esc(rangeLabel)}</strong>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <div class="tab-switch">
          <button class="tab-btn ${mode === 'month' ? 'active' : ''}" onclick="state.ui.calendarMode='month';render()">Month</button>
          <button class="tab-btn ${mode === 'week' ? 'active' : ''}" onclick="state.ui.calendarMode='week';render()">Week</button>
          <button class="tab-btn ${mode === 'day' ? 'active' : ''}" onclick="state.ui.calendarMode='day';render()">Day</button>
        </div>
        <button class="btn btn-sm btn-primary" id="syncCalUrlBtn" onclick="importCalendarFromUrl()" title="Fetch & import events directly from your configured Google Calendar / Outlook public .ics URL">🔄 Sync URL</button>
        <button class="btn btn-sm" onclick="exportCalendarICS()" title="Download an .ics file to import into Google Calendar or Outlook">⬇️ Export .ics</button>
        <button class="btn btn-sm" onclick="document.getElementById('icsImportInput').click()" title="Import events from a local .ics file">⬆️ Import .ics</button>
        <input type="file" id="icsImportInput" accept=".ics,text/calendar" style="display:none" onchange="importCalendarICS(event)" />
      </div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:0.76rem;color:var(--text-muted);margin-bottom:12px;">
      <span><span class="cal-pill pill-planned" style="pointer-events:none">Task Planned</span></span>
      <span><span class="cal-pill pill-subtask" style="pointer-events:none">Subtask Planned</span></span>
      <span><span class="cal-pill pill-due" style="pointer-events:none">📌 Due Date</span></span>
      <span><span class="cal-pill pill-time" style="pointer-events:none">⏱ Time Entry</span></span>
      <span><span class="cal-pill pill-ics" style="pointer-events:none">📆 Imported (.ics)</span></span>
    </div>

    <div class="cal-layout">
      <div class="cal-tray">
        <div style="font-weight:700;font-size:0.9rem;margin-bottom:6px;">Drag to Schedule</div>
        <div class="field-hint" style="margin-bottom:8px;">Drag any task or subtask onto a calendar day or hour slot.</div>
        <div style="margin-bottom:10px;">
          <label style="font-size:0.74rem;margin-bottom:3px;">Dragging from this list sets:</label>
          <select style="font-size:0.78rem;padding:5px 8px;" onchange="state.ui.calendarDragTarget=this.value">
            <option value="planned" ${state.ui.calendarDragTarget === 'planned' ? 'selected' : ''}>Planned Date / Time</option>
            <option value="due" ${state.ui.calendarDragTarget === 'due' ? 'selected' : ''}>Due Date (Tasks)</option>
          </select>
        </div>
        ${trayItems.length === 0 ? `<div style="font-size:0.8rem;color:var(--text-muted);text-align:center;padding:16px 4px;">All tasks are Done!</div>` : trayItems.map(item => `
          <div class="cal-tray-item" draggable="true"
            ondragstart="calDragStart(event, { source: 'tray', type: '${item.type}', taskId: '${item.taskId}', subtaskId: ${item.subtaskId ? `'${item.subtaskId}'` : 'null'} })"
            title="${item.parentTitle ? esc(item.parentTitle) + ' → ' : ''}${esc(item.title)}">
            <div style="font-weight:600;">${esc(item.title)}</div>
            <div style="font-size:0.72rem;color:var(--text-muted);">${esc(item.meta)}</div>
          </div>
        `).join('')}
      </div>

      <div>
        ${mode === 'month' ? renderCalendarMonth(cur) : (mode === 'week' ? renderCalendarWeek(cur) : renderCalendarDay(cur))}
      </div>
    </div>
  `;
}

function renderCalPill(item) {
  if (item.kind === 'planned-task') {
    const tLbl = item.time ? `${item.time} ` : '';
    const dur = item.estHours ? ` (${item.estHours}h)` : '';
    return `<div class="cal-pill pill-planned" draggable="true"
      ondragstart="calDragStart(event, { source: 'cal', kind: 'planned-task', taskId: '${item.taskId}', subtaskId: null })"
      onclick="openTaskModal('${item.taskId}')"
      title="Planned Task: ${esc(item.title)}${dur} — Drag to reschedule or click to edit">🗓 ${esc(tLbl + item.title + dur)}</div>`;
  }
  if (item.kind === 'planned-subtask') {
    const tLbl = item.time ? `${item.time} ` : '';
    const dur = item.estHours ? ` (${item.estHours}h)` : '';
    return `<div class="cal-pill pill-subtask" draggable="true"
      ondragstart="calDragStart(event, { source: 'cal', kind: 'planned-subtask', taskId: '${item.taskId}', subtaskId: '${item.subtaskId}' })"
      onclick="openSubtaskModal('${item.taskId}','${item.subtaskId}')"
      title="Planned Subtask: ${esc(item.title)}${dur} — Drag to reschedule or click to edit">↳ ${esc(tLbl + item.shortTitle + dur)}</div>`;
  }
  if (item.kind === 'due-task') {
    return `<div class="cal-pill pill-due" draggable="true"
      ondragstart="calDragStart(event, { source: 'cal', kind: 'due-task', taskId: '${item.taskId}', subtaskId: null })"
      onclick="openTaskModal('${item.taskId}')"
      title="Due Date: ${esc(item.title)} — Drag to another day to change due date">📌 ${esc(item.title)}</div>`;
  }
  if (item.kind === 'time-entry') {
    return `<div class="cal-pill pill-time" onclick="openTimeEntryModal('${item.entryId}')" title="Logged time entry — Click to edit">⏱ ${esc(item.title)}</div>`;
  }
  if (item.kind === 'ics-event') {
    const tLbl = item.time ? `${item.time} ` : '';
    return `<div class="cal-pill pill-ics" onclick="openIcsEventModal('${item.eventId}')" title="Imported calendar event">📆 ${esc(tLbl + item.title)}</div>`;
  }
  return '';
}

function renderCalendarMonth(cur) {
  const year = cur.getFullYear();
  const month = cur.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1); // Mon=0
  const gridStart = new Date(year, month, 1 - startOffset);
  const today = todayStr();
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  let cellsHtml = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const dStr = formatLocalDate(d);
    const isOther = d.getMonth() !== month;
    const isToday = dStr === today;
    const items = collectCalendarItemsForDate(dStr);
    cellsHtml += `
      <div class="cal-cell ${isOther ? 'other-month' : ''} ${isToday ? 'is-today' : ''}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="calHandleDrop(event, '${dStr}', '', this)">
        <div class="cal-date-num">
          <span>${d.getDate()}</span>
          ${isToday ? '<span style="font-size:0.65rem;font-weight:800;">TODAY</span>' : ''}
        </div>
        ${items.map(renderCalPill).join('')}
      </div>
    `;
  }
  return `<div class="cal-month-grid">${cellsHtml}</div>`;
}

function formatCalendarHourLabel(h) {
  const ampm = h < 12 ? 'AM' : 'PM';
  const hr12 = h % 12 === 0 ? 12 : h % 12;
  const hr24 = String(h).padStart(2, '0') + ':00';
  return `<strong>${hr12} ${ampm}</strong><div style="font-size:0.65rem;opacity:0.75;">${hr24}</div>`;
}

function renderCalendarWeek(cur) {
  const day = cur.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const mon = new Date(cur); mon.setDate(cur.getDate() + diff);
  const today = todayStr();
  const weekDates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    weekDates.push({ obj: d, str: formatLocalDate(d) });
  }
  const hours = [];
  for (let h = 0; h <= 23; h++) hours.push(h);

  let html = `<div class="cal-time-grid-wrap"><div class="cal-time-grid week-cols">`;
  // Header row
  html += `<div class="cal-day-header">Time</div>`;
  weekDates.forEach(wd => {
    const lbl = wd.obj.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
    html += `<div class="cal-day-header" style="${wd.str === today ? 'color:var(--primary);background:var(--primary-soft);' : ''}">${lbl}</div>`;
  });

  // All-day / Due / Untimed row
  html += `<div class="cal-hour-label">All-day<br/>/ Due</div>`;
  weekDates.forEach(wd => {
    const dayAll = collectCalendarItemsForDate(wd.str);
    const weekTimedKeys = new Set(dayAll.filter(it => it.time && it.taskId).map(it => `${it.taskId}::${it.subtaskId || ''}`));
    const items = dayAll.filter(it => {
      if (it.time) return false;
      if (it.kind === 'time-entry' && it.taskId && weekTimedKeys.has(`${it.taskId}::${it.subtaskId || ''}`)) return false;
      return true;
    });
    html += `
      <div class="cal-allday-slot"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="calHandleDrop(event, '${wd.str}', '', this)">
        ${items.map(renderCalPill).join('')}
      </div>
    `;
  });

  // Hourly rows (12 AM to 11 PM)
  hours.forEach(h => {
    const hPrefix = String(h).padStart(2, '0');
    const hr = `${hPrefix}:00`;
    html += `<div class="cal-hour-label" title="${hr}">${formatCalendarHourLabel(h)}</div>`;
    weekDates.forEach(wd => {
      const items = collectCalendarItemsForDate(wd.str).filter(it => it.time && it.time.slice(0, 2) === hPrefix);
      html += `
        <div class="cal-hour-slot"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="calHandleDrop(event, '${wd.str}', '${hr}', this)">
          ${items.map(renderCalPill).join('')}
        </div>
      `;
    });
  });

  html += `</div></div>`;
  return html;
}

function getLoggedEntryForCalendarItem(taskId, subtaskId, dateStr) {
  return state.timeEntries.find(e =>
    e.taskId === taskId &&
    (e.subtaskId || null) === (subtaskId || null) &&
    e.date === dateStr
  ) || null;
}

function getCalendarItemEffectiveHours(item, dateStr) {
  const logged = item.taskId ? getLoggedEntryForCalendarItem(item.taskId, item.subtaskId, dateStr) : null;
  if (logged) {
    return Math.max(0.25, Math.round((logged.durationSeconds / 3600) * 4) / 4);
  }
  const t = item.taskId ? getTask(item.taskId) : null;
  const target = (t && item.subtaskId) ? (t.subtasks || []).find(s => s.id === item.subtaskId) : t;
  const draft = target && target.actualDraftHours ? Number(target.actualDraftHours) : 0;
  const base = draft > 0 ? draft : (Number(item.estHours || 0) > 0 ? Number(item.estHours) : 0.5);
  return Math.max(0.25, Math.round(base * 4) / 4);
}

function formatMinsToTime(totalMins) {
  totalMins = ((totalMins % 1440) + 1440) % 1440;
  const hh = String(Math.floor(totalMins / 60)).padStart(2, '0');
  const mm = String(totalMins % 60).padStart(2, '0');
  return `${hh}:${mm}`;
}

function toggleCalendarItemActualCheck(taskId, subtaskId, dateStr, checked) {
  const t = getTask(taskId);
  if (!t) return;
  const sub = subtaskId ? (t.subtasks || []).find(s => s.id === subtaskId) : null;
  const target = sub || t;
  const existing = getLoggedEntryForCalendarItem(taskId, subtaskId, dateStr);

  if (checked) {
    const hrs = Math.max(0.25, Math.round((Number(target.actualDraftHours || target.estimatedHours || 0.5)) * 4) / 4);
    const secs = Math.round(hrs * 3600);
    if (existing) {
      existing.durationSeconds = secs;
    } else {
      const category = (sub && sub.category) ? sub.category : t.category;
      state.timeEntries.unshift({
        id: uid('time'),
        projectId: t.projectId,
        taskId: t.id,
        subtaskId: subtaskId || null,
        category,
        billable: isTaskBillable(t),
        date: dateStr,
        durationSeconds: secs,
        note: 'Logged from Calendar'
      });
    }
    if (sub) sub.status = 'Done';
    else {
      const wasDone = t.status === 'Done';
      t.status = 'Done';
      if (!wasDone) spawnNextRecurringTask(t);
    }
    saveState();
    render();
    showToast(`Logged ${hrs}h to Time Tracker`);
  } else {
    if (existing) {
      state.timeEntries = state.timeEntries.filter(e => e.id !== existing.id);
    }
    if (sub) sub.status = 'To do';
    else t.status = 'To do';
    saveState();
    render();
    showToast('Removed time entry from Time Tracker');
  }
}

let activeResizeState = null;

function startCalendarBlockResize(event, taskId, subtaskId, dateStr, startMins, hourPx) {
  event.preventDefault();
  event.stopPropagation();
  const blockEl = event.target.closest('.cal-day-block');
  if (!blockEl) return;

  const t = getTask(taskId);
  const sub = (t && subtaskId) ? (t.subtasks || []).find(s => s.id === subtaskId) : null;
  const target = sub || t;
  if (!target) return;

  const logged = getLoggedEntryForCalendarItem(taskId, subtaskId, dateStr);
  const initialHours = logged
    ? Math.max(0.25, Math.round((logged.durationSeconds / 3600) * 4) / 4)
    : Math.max(0.25, Math.round((Number(target.actualDraftHours || target.estimatedHours || 0.5)) * 4) / 4);

  activeResizeState = {
    blockEl,
    taskId,
    subtaskId: subtaskId || null,
    dateStr,
    startMins,
    hourPx,
    startY: event.clientY,
    initialHours,
    currentHours: initialHours
  };

  document.addEventListener('mousemove', onCalendarBlockResizeMove);
  document.addEventListener('mouseup', onCalendarBlockResizeEnd);
}

function onCalendarBlockResizeMove(event) {
  if (!activeResizeState) return;
  const dy = event.clientY - activeResizeState.startY;
  const deltaHours = dy / activeResizeState.hourPx;
  // Snap to 15-minute (0.25h) intervals, minimum 15 minutes
  let newHours = Math.round((activeResizeState.initialHours + deltaHours) * 4) / 4;
  if (newHours < 0.25) newHours = 0.25;
  const maxHours = (1440 - activeResizeState.startMins) / 60;
  if (newHours > maxHours) newHours = Math.floor(maxHours * 4) / 4;
  activeResizeState.currentHours = newHours;

  const newHeight = Math.max(20, newHours * activeResizeState.hourPx - 2);
  activeResizeState.blockEl.style.height = `${newHeight}px`;

  const durLbl = activeResizeState.blockEl.querySelector('.cal-dur-live');
  if (durLbl) {
    const endStr = formatMinsToTime(activeResizeState.startMins + Math.round(newHours * 60));
    durLbl.textContent = `${formatMinsToTime(activeResizeState.startMins)}–${endStr} • ${newHours}h`;
  }
}

function onCalendarBlockResizeEnd() {
  document.removeEventListener('mousemove', onCalendarBlockResizeMove);
  document.removeEventListener('mouseup', onCalendarBlockResizeEnd);
  if (!activeResizeState) return;

  const { taskId, subtaskId, dateStr, currentHours, initialHours } = activeResizeState;
  activeResizeState = null;

  if (currentHours === initialHours) return;

  const t = getTask(taskId);
  if (!t) return;
  const sub = subtaskId ? (t.subtasks || []).find(s => s.id === subtaskId) : null;
  const target = sub || t;

  // Save resized actual duration
  target.actualDraftHours = currentHours;

  // If already logged in Time Tracker for this date, update the logged entry immediately
  const logged = getLoggedEntryForCalendarItem(taskId, subtaskId, dateStr);
  if (logged) {
    logged.durationSeconds = Math.round(currentHours * 3600);
    saveState();
    render();
    showToast(`Updated logged actual time to ${currentHours}h`);
  } else {
    saveState();
    render();
    showToast(`Actual duration set to ${currentHours}h (check box to log)`);
  }
}

function renderCalendarDay(cur) {
  const dStr = formatLocalDate(cur);
  const allItems = collectCalendarItemsForDate(dStr);
  const timed = allItems.filter(it => it.time && it.kind !== 'time-entry');
  const timedKeys = new Set(timed.filter(it => it.taskId).map(it => `${it.taskId}::${it.subtaskId || ''}`));
  const untimed = allItems.filter(it => {
    if (it.time) return false;
    // Avoid duplicating a time-entry in All-day if its task/subtask is already shown on the timeline
    if (it.kind === 'time-entry' && it.taskId && timedKeys.has(`${it.taskId}::${it.subtaskId || ''}`)) return false;
    return true;
  });

  // Parse timed items & check if any item uses a 15-minute interval (start or duration)
  let has15MinInterval = false;
  const blocks = timed.map(it => {
    const [hh, mm] = it.time.split(':').map(Number);
    const startMins = (hh || 0) * 60 + (mm || 0);
    const effHours = (it.kind === 'planned-task' || it.kind === 'planned-subtask')
      ? getCalendarItemEffectiveHours(it, dStr)
      : Math.max(0.25, Number(it.estHours || 1));
    const durMins = Math.round(effHours * 60);
    if ((startMins % 30 !== 0) || (durMins % 30 !== 0)) {
      has15MinInterval = true;
    }
    const logged = it.taskId ? getLoggedEntryForCalendarItem(it.taskId, it.subtaskId, dStr) : null;
    return {
      ...it,
      startMins,
      endMins: startMins + durMins,
      effHours,
      logged
    };
  }).sort((a, b) => a.startMins - b.startMins || (b.endMins - a.endMins));

  // Dynamic hour height: expand to 96px/hr only when a 15-minute task exists on this day
  const hourPx = has15MinInterval ? 96 : 56;

  // Assign side-by-side columns for overlapping blocks
  const lanes = [];
  blocks.forEach(blk => {
    let placed = false;
    for (let i = 0; i < lanes.length; i++) {
      if (lanes[i] <= blk.startMins) {
        lanes[i] = blk.endMins;
        blk.lane = i;
        placed = true;
        break;
      }
    }
    if (!placed) {
      blk.lane = lanes.length;
      lanes.push(blk.endMins);
    }
  });
  const totalLanes = Math.max(1, lanes.length);

  const hours = [];
  for (let h = 0; h <= 23; h++) hours.push(h);

  let html = `<div class="cal-time-grid-wrap">`;
  // Header + All-day row
  html += `<div class="cal-time-grid day-cols">`;
  html += `<div class="cal-day-header">Time</div><div class="cal-day-header">${cur.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}${has15MinInterval ? ' <span class="badge b-cat" style="margin-left:6px;">15m grid</span>' : ''}</div>`;
  html += `<div class="cal-hour-label">All-day<br/>/ Due</div>`;
  html += `
    <div class="cal-allday-slot"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="calHandleDrop(event, '${dStr}', '', this)">
      ${untimed.map(renderCalPill).join('') || '<span style="font-size:0.75rem;color:var(--text-muted)">Drop here for all-day or due date</span>'}
    </div>
  `;
  html += `</div>`;

  // Proportional 24-hour timeline
  html += `<div class="cal-day-timeline">`;
  html += `<div class="cal-day-hours-col">`;
  hours.forEach(h => {
    const hr = `${String(h).padStart(2, '0')}:00`;
    html += `<div class="cal-day-hour-cell" style="height:${hourPx}px;" title="${hr}">${formatCalendarHourLabel(h)}</div>`;
  });
  html += `</div>`;

  html += `<div class="cal-day-events-col" style="height:${24 * hourPx}px;">`;
  // Background drop slots
  hours.forEach(h => {
    const hr = `${String(h).padStart(2, '0')}:00`;
    html += `
      <div class="cal-day-bg-slot ${has15MinInterval ? 'has-15m' : ''}" style="height:${hourPx}px;"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="calHandleDrop(event, '${dStr}', '${hr}', this)"></div>
    `;
  });

  // Proportional event blocks
  blocks.forEach(blk => {
    const topPx = (blk.startMins / 60) * hourPx;
    const heightPx = Math.max(22, blk.effHours * hourPx - 2);
    const widthPct = 100 / totalLanes;
    const leftPct = blk.lane * widthPct;
    const endStr = formatMinsToTime(blk.endMins);
    const isTaskLike = blk.kind === 'planned-task' || blk.kind === 'planned-subtask';
    const cls = blk.logged ? 'blk-logged' : (blk.kind === 'planned-subtask' ? 'blk-subtask' : (blk.kind === 'planned-task' ? 'blk-planned' : 'blk-ics'));
    const subArg = blk.subtaskId ? `'${blk.subtaskId}'` : 'null';
    const clickAction = blk.kind === 'planned-subtask'
      ? `openSubtaskModal('${blk.taskId}','${blk.subtaskId}')`
      : (blk.kind === 'planned-task' ? `openTaskModal('${blk.taskId}')` : `openIcsEventModal('${blk.eventId}')`);

    const dragAttr = isTaskLike
      ? `draggable="true" ondragstart="calDragStart(event, { source: 'cal', kind: '${blk.kind}', taskId: '${blk.taskId}', subtaskId: ${subArg} })"`
      : '';

    const labelText = blk.kind === 'planned-subtask' ? `↳ ${blk.shortTitle}` : blk.title;
    const planNote = (blk.estHours && blk.estHours !== blk.effHours) ? ` (Plan ${blk.estHours}h)` : '';
    const statusTag = blk.logged ? '✓ Logged' : 'Actual';

    html += `
      <div class="cal-day-block ${cls}" ${dragAttr}
        style="top:${topPx}px;height:${heightPx}px;left:calc(${leftPct}% + 3px);width:calc(${widthPct}% - 6px);">
        <div class="cal-day-block-header">
          ${isTaskLike ? `<input type="checkbox" ${blk.logged ? 'checked' : ''}
            onclick="event.stopPropagation()"
            onchange="toggleCalendarItemActualCheck('${blk.taskId}', ${subArg}, '${dStr}', this.checked)"
            title="${blk.logged ? 'Logged to Time Tracker (uncheck to remove)' : 'Check to log actual time to Time Tracker'}" />` : ''}
          <span class="cal-day-block-title" onclick="${clickAction}" title="${esc(blk.title)}">${esc(labelText)}</span>
          <span class="cal-dur-live" style="font-size:0.7rem;font-weight:700;white-space:nowrap;">${blk.time}–${endStr} • ${blk.effHours}h</span>
        </div>
        ${heightPx >= 36 ? `<div class="cal-day-block-meta">${statusTag}: <strong>${blk.effHours}h</strong>${planNote}</div>` : ''}
        ${isTaskLike ? `<div class="cal-resize-handle" title="Drag bottom edge to adjust actual duration in 15-minute intervals"
          onmousedown="startCalendarBlockResize(event, '${blk.taskId}', ${subArg}, '${dStr}', ${blk.startMins}, ${hourPx})"></div>` : ''}
      </div>
    `;
  });

  html += `</div></div></div>`;
  return html;
}

function calDragStart(event, payload) {
  event.dataTransfer.setData('application/json', JSON.stringify(payload));
}

function calHandleDrop(event, targetDate, targetTime, el) {
  event.preventDefault();
  el.classList.remove('drag-over');
  let data = null;
  try {
    data = JSON.parse(event.dataTransfer.getData('application/json'));
  } catch (e) { return; }
  if (!data || !data.taskId) return;

  const task = getTask(data.taskId);
  if (!task) return;

  // Case 1: Dragging an existing Due Date pill -> update dueDate
  if (data.source === 'cal' && data.kind === 'due-task') {
    task.dueDate = targetDate;
    saveState();
    render();
    showToast(`Due date moved to ${targetDate}`);
    return;
  }

  // Case 2: Dragging from Tray with "Due Date" mode selected
  if (data.source === 'tray' && state.ui.calendarDragTarget === 'due') {
    if (data.subtaskId) {
      const sub = (task.subtasks || []).find(s => s.id === data.subtaskId);
      if (sub) sub.dueDate = targetDate;
    } else {
      task.dueDate = targetDate;
    }
    saveState();
    render();
    showToast(`Due date set to ${targetDate}`);
    return;
  }

  // Case 3: Planning a task or subtask (from tray or moving on calendar)
  if (data.subtaskId) {
    const sub = (task.subtasks || []).find(s => s.id === data.subtaskId);
    if (sub) {
      sub.plannedDate = targetDate;
      if (targetTime) sub.plannedStartTime = targetTime;
      saveState();
      render();
      showToast(`Subtask planned for ${targetDate}${targetTime ? ' at ' + targetTime : ''}`);
    }
  } else {
    task.plannedDate = targetDate;
    if (targetTime) task.plannedStartTime = targetTime;
    saveState();
    render();
    showToast(`Task planned for ${targetDate}${targetTime ? ' at ' + targetTime : ''}`);
  }
}

function escapeICS(str) {
  return String(str || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
}

function exportCalendarICS() {
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Cadence Personal Work Manager//EN',
    'CALSCALE:GREGORIAN'
  ];

  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';

  function addEvent(uidStr, summary, desc, dateStr, startTime, estHours) {
    if (!dateStr) return;
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${uidStr}@workflow.local`);
    lines.push(`DTSTAMP:${stamp}`);
    const ymd = dateStr.replace(/-/g, '');
    if (startTime) {
      const [hh, mm] = startTime.split(':').map(Number);
      const startObj = new Date(Number(ymd.slice(0,4)), Number(ymd.slice(4,6)) - 1, Number(ymd.slice(6,8)), hh || 9, mm || 0);
      const durMs = Math.max(0.25, Number(estHours || 1)) * 3600 * 1000;
      const endObj = new Date(startObj.getTime() + durMs);
      const fmtDT = (d) => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
      lines.push(`DTSTART:${fmtDT(startObj)}`);
      lines.push(`DTEND:${fmtDT(endObj)}`);
    } else {
      lines.push(`DTSTART;VALUE=DATE:${ymd}`);
    }
    lines.push(`SUMMARY:${escapeICS(summary)}`);
    if (desc) lines.push(`DESCRIPTION:${escapeICS(desc)}`);
    lines.push('END:VEVENT');
  }

  state.tasks.forEach(t => {
    const projName = getProject(t.projectId)?.name || '';
    if (t.plannedDate) {
      addEvent(`plan-${t.id}`, `[Planned] ${t.title}`, `Project: ${projName}\n${(t.description || '').replace(/<[^>]+>/g, ' ').trim()}`, t.plannedDate, t.plannedStartTime, t.estimatedHours);
    }
    if (t.dueDate) {
      addEvent(`due-${t.id}`, `[Due] ${t.title}`, `Project: ${projName}\nStatus: ${t.status}`, t.dueDate, '', 0);
    }
    (t.subtasks || []).forEach(sub => {
      if (sub.plannedDate) {
        addEvent(`sub-${sub.id}`, `[Subtask] ${sub.title} (${t.title})`, `Project: ${projName}`, sub.plannedDate, sub.plannedStartTime, sub.estimatedHours);
      }
    });
  });

  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cadence-calendar-${todayStr()}.ics`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Calendar .ics file downloaded');
}

function ensureCalendarInboxTask() {
