<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadence — Personal Work Manager</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --success: #10b981;
    --success-soft: #ecfdf5;
    --warning: #f59e0b;
    --warning-soft: #fffbeb;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --info: #0ea5e9;
    --info-soft: #f0f9ff;
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.12);
    --radius: 10px;
    --sidebar-w: 250px;
  }

  [data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #0f172a;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --primary-soft: rgba(99, 102, 241, 0.18);
    --success: #34d399;
    --success-soft: rgba(16, 185, 129, 0.15);
    --warning: #fbbf24;
    --warning-soft: rgba(245, 158, 11, 0.15);
    --danger: #f87171;
    --danger-soft: rgba(239, 68, 68, 0.15);
    --info: #38bdf8;
    --info-soft: rgba(14, 165, 233, 0.15);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 40;
    transition: transform 0.2s ease;
  }
  .sidebar-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
  }
  .brand-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 0.95rem;
  }
  .nav-list {
    padding: 12px 10px;
    flex: 1;
    overflow-y: auto;
  }
  .nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.94rem;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .nav-badge {
    margin-left: auto;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .sidebar-footer {
    padding: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .storage-notice {
    font-size: 0.74rem;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 8px 10px;
    border-radius: 8px;
    line-height: 1.35;
  }
  .sidebar-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  /* Main wrapper */
  .main-wrap {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Topbar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .menu-btn {
    display: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .page-title { font-size: 1.25rem; font-weight: 700; }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Active Timer Banner */
  .active-timer-pill {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .active-timer-pill.visible { display: inline-flex; }
  .pulse-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* Content */
  .content {
    padding: 24px;
    max-width: 1360px;
    width: 100%;
    margin: 0 auto;
  }
  .helper-banner {
    font-size: 0.86rem;
    color: var(--text-muted);
    margin-bottom: 18px;
  }

  /* Cards & Grids */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .card-title { font-size: 1.02rem; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-value { font-size: 1.65rem; font-weight: 800; margin-top: 4px; }
  .kpi-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { opacity: 0.9; }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-sm { padding: 5px 10px; font-size: 0.78rem; }
  .btn-xs { padding: 3px 7px; font-size: 0.73rem; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

  /* Inputs */
  .form-group { margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form-row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--text);
  }
  .field-hint {
    font-size: 0.74rem;
    color: var(--text-muted);
    margin-top: 3px;
  }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="url"], select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.88rem;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--primary);
    outline-offset: -1px;
  }
  textarea { resize: vertical; min-height: 75px; }

  /* Badges & Pills */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.73rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .b-todo { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
  .b-progress { background: var(--info-soft); color: var(--info); }
  .b-blocked { background: var(--danger-soft); color: var(--danger); }
  .b-done { background: var(--success-soft); color: var(--success); }
  .b-high { background: var(--danger-soft); color: var(--danger); }
  .b-medium { background: var(--warning-soft); color: var(--warning); }
  .b-low { background: var(--success-soft); color: var(--success); }
  .b-cat { background: var(--primary-soft); color: var(--primary); }
  .b-billable { background: var(--success-soft); color: var(--success); }
  .b-nonbillable { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
  .b-warn { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); }

  /* Filter bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filter-bar input, .filter-bar select {
    width: auto;
    min-width: 135px;
    flex: 1 1 135px;
    max-width: 220px;
  }

  /* Task items */
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .task-item:hover { border-color: var(--primary); }
  .task-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .task-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .task-title { font-weight: 700; font-size: 0.96rem; }
  .task-title.done { text-decoration: line-through; color: var(--text-muted); }
  .task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .task-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* Progress bar */
  .progress-wrap {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track {
    flex: 1;
    height: 7px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    max-width: 240px;
  }
  .progress-fill {
    height: 100%;
    background: var(--success);
    border-radius: 999px;
    transition: width 0.2s;
  }
  .progress-text { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; }

  /* Subtasks list inside task */
  .subtasks-box {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .subtask-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 7px;
    background: var(--surface-2);
    margin-bottom: 6px;
    flex-wrap: wrap;
    font-size: 0.84rem;
  }
  .subtask-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Kanban Board */
  .kanban-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(230px, 1fr));
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .kanban-col {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
  }
  .kanban-col.drag-over {
    border: 2px dashed var(--primary);
    background: var(--primary-soft);
  }
  .kanban-col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .kanban-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px;
    margin-bottom: 9px;
    cursor: grab;
    box-shadow: var(--shadow);
  }
  .kanban-card:active { cursor: grabbing; }

  /* Stages list in project modal */
  .stage-chip-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  /* Rich text toolbar for Notes */
  .rte-toolbar {
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
  }
  .rte-editor {
    min-height: 150px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 0 0 8px 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.92rem;
    outline: none;
    overflow-y: auto;
  }
  .rte-editor.desc-editor {
    min-height: 190px;
  }
  .rte-editor ol { padding-left: 22px; margin: 6px 0; }
  .rte-rendered { display: inline; }
  .rte-rendered ul, .rte-rendered ol { padding-left: 20px; margin: 4px 0; }
  .rte-rendered p { margin: 4px 0; }
  .rte-rendered h3 { margin: 6px 0 3px; font-size: 1rem; }
  .rte-editor:focus { border-color: var(--primary); }
  .rte-editor ul { padding-left: 22px; margin: 6px 0; }
  .rte-editor h3 { margin: 8px 0 4px; font-size: 1.05rem; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  th {
    font-size: 0.76rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    background: var(--surface-2);
  }

  /* Charts */
  .bar-row {
    margin-bottom: 10px;
  }
  .bar-row-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.84rem;
    margin-bottom: 4px;
  }
  .bar-track {
    height: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--primary);
  }
  .day-chart {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 170px;
    padding-top: 20px;
    overflow-x: auto;
  }
  .day-col {
    flex: 1 0 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .day-bar {
    width: 24px;
    background: var(--primary);
    border-radius: 6px 6px 0 0;
    min-height: 2px;
    transition: height 0.2s;
  }
  .day-val { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
  .day-lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; white-space: nowrap; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    padding: 22px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--text);
    color: var(--surface);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.86rem;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .empty-state {
    text-align: center;
    padding: 36px 20px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .tab-switch {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 35;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .main-wrap { margin-left: 0; }
    .menu-btn { display: inline-flex; }
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
  }

  
  /* Calendar Styles */
  .cal-layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 16px;
    align-items: start;
  }
  .cal-tray {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    max-height: 76vh;
    overflow-y: auto;
  }
  .cal-tray-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 9px;
    margin-bottom: 7px;
    font-size: 0.8rem;
    cursor: grab;
  }
  .cal-tray-item:active { cursor: grabbing; }
  .cal-tray-item:hover { border-color: var(--primary); }

  .cal-month-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .cal-day-header {
    padding: 8px 6px;
    text-align: center;
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }
  .cal-cell {
    min-height: 112px;
    padding: 6px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: background 0.12s;
  }
  .cal-cell.other-month { background: var(--surface-2); opacity: 0.6; }
  .cal-cell.is-today { background: var(--primary-soft); }

<script>
// ===================== DATA & STORAGE =====================
const STORAGE_KEY = 'workflow_manager_data_v1';
const THEME_KEY = 'workflow_manager_theme_v1';
const IDB_NAME = 'WorkFlowManagerDB';
const IDB_STORE = 'appState';
const IDB_KEY = 'main';

function openAppDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGetState() {
  const db = await openAppDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbSetState(data) {
  const db = await openAppDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(data, IDB_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
const DEFAULT_CATEGORIES = ['Slack', 'Jira', 'Support', 'Learning', 'Administrative', 'Dependency'];
function getCategories() {
  const custom = state.settings?.categories;
  if (Array.isArray(custom) && custom.length > 0) return custom;
  return DEFAULT_CATEGORIES.slice();
}
const STATUSES = ['To do', 'In progress', 'Blocked', 'Done'];
const PRIORITIES = ['Low', 'Medium', 'High'];

let state = {
  projects: [],
  tasks: [],
  notes: [],
  timeEntries: [],
  calendarEvents: [], // imported .ics events
  assignees: [], // { id, name, email, team, leftOrg }
  savedTaskFilters: [], // { id, name, description, filters }
  defaultTaskFilter: null, // { filters }
  settings: {
    jiraBaseUrl: '',
    supportTool: 'Zendesk', // Zendesk | Freshdesk | Jira Service Management | Other
    supportBaseUrl: '',
    slackWebhookUrl: '',
    slackNotifyCreated: true,
    slackNotifyCompleted: true,
    slackNotifyOverdue: true,
    proxyUrl: '',
    calendarIcsUrl: '',
    jiraEmail: '',
    jiraApiToken: '',
    jiraDefaultProjectKey: '',
    jiraIssueType: 'Task',
    jiraAutoSyncWorklogs: false,
    categories: null
  },
  activeTimer: null, // { taskId, subtaskId, startedAt }
  ui: {
    view: 'today',
    calendarMode: 'day', // month | week | day
    calendarDate: '',
    calendarDragTarget: 'planned', // planned | due
    taskViewMode: 'list', // list | kanban
    showArchivedProjects: false,
    taskFilters: { search: '', projectId: '', stageId: '', category: '', status: '__open__', priority: '', due: '', assignees: [], team: '', planned: '', defaultApplied: false },
    noteSearch: '',
    reportRange: 'week', // week | month | custom | all
    reportStart: '',
    reportEnd: '',
    activeTaskPresetId: ''
  }
};

function uid(prefix = 'id') {
  return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function todayStr() {
  return formatLocalDate(new Date());
}

function addDaysStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

async function loadState() {
  // 1. Try IndexedDB first (large capacity)
  try {
    const idbData = await idbGetState();
    if (idbData && Array.isArray(idbData.projects)) {
      state.projects = idbData.projects || [];
      state.tasks = idbData.tasks || [];
      state.notes = idbData.notes || [];
      state.timeEntries = idbData.timeEntries || [];
      state.calendarEvents = idbData.calendarEvents || [];
      state.assignees = idbData.assignees || [];
      syncAssigneesFromTasks();
      state.settings = Object.assign({ jiraBaseUrl: '', supportTool: 'Zendesk', supportBaseUrl: '', slackWebhookUrl: '', slackNotifyCreated: true, slackNotifyCompleted: true, slackNotifyOverdue: true, proxyUrl: '', calendarIcsUrl: '', jiraEmail: '', jiraApiToken: '', jiraDefaultProjectKey: '', jiraIssueType: 'Task', jiraAutoSyncWorklogs: false, categories: null }, idbData.settings || {});
      state.savedTaskFilters = idbData.savedTaskFilters || [];
      state.defaultTaskFilter = idbData.defaultTaskFilter || null;
      state.activeTimer = idbData.activeTimer || null;
      applyDefaultTaskFilterOnLoad();
      return;
    }
  } catch (e) {
    console.warn('IndexedDB load skipped:', e);
  }

  // 2. Fallback & automatic migration from localStorage
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.projects = parsed.projects || [];
      state.tasks = parsed.tasks || [];
      state.notes = parsed.notes || [];
      state.timeEntries = parsed.timeEntries || [];
      state.calendarEvents = parsed.calendarEvents || [];
      state.assignees = parsed.assignees || [];
      syncAssigneesFromTasks();
      state.assignees = parsed.assignees || [];
      syncAssigneesFromTasks();
      state.settings = Object.assign({ jiraBaseUrl: '', supportTool: 'Zendesk', supportBaseUrl: '', slackWebhookUrl: '', slackNotifyCreated: true, slackNotifyCompleted: true, slackNotifyOverdue: true, proxyUrl: '', calendarIcsUrl: '', jiraEmail: '', jiraApiToken: '', jiraDefaultProjectKey: '', jiraIssueType: 'Task', jiraAutoSyncWorklogs: false, categories: null }, parsed.settings || {});
      state.savedTaskFilters = parsed.savedTaskFilters || [];
      state.defaultTaskFilter = parsed.defaultTaskFilter || null;
      state.activeTimer = parsed.activeTimer || null;
      applyDefaultTaskFilterOnLoad();
      saveState(); // migrate into IndexedDB

    }
  } catch (e) {

    activeTimer: state.activeTimer
  };
  // Save to IndexedDB (supports large calendars & hundreds of MBs)
  idbSetState(toSave).catch(err => {
    console.warn('IndexedDB save failed, trying localStorage:', err);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    } catch (lsErr) {
      alert('Warning: Browser storage is full, so your latest change could not be saved. Try exporting a backup and clearing old items.');
    }
  });
  // Also keep localStorage in sync when data is small enough
  try {
    const serialized = JSON.stringify(toSave);
    if (serialized.length < 3500000) {
      localStorage.setItem(STORAGE_KEY, serialized);
    }
  } catch (e) {
    // Ignore localStorage quota error since IndexedDB handles large datasets
  }
  updateTodayBadge();
}

// ===================== HELPERS =====================
function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function sanitizeNoteHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';
  const allowed = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'H3', 'H2', 'UL', 'OL', 'LI', 'P', 'BR', 'DIV', 'SPAN']);
  function walk(node) {
    for (let i = node.childNodes.length - 1; i >= 0; i--) {
      const child = node.childNodes[i];
      if (child.nodeType === 1) {
        if (!allowed.has(child.tagName)) {
          const text = document.createTextNode(child.textContent);
          node.replaceChild(text, child);
        } else {
          // Strip all attributes
          while (child.attributes.length > 0) child.removeAttribute(child.attributes[0].name);
          walk(child);
        }
      }
    }
  }
  walk(div);
  return div.innerHTML;
}

function getProject(id) { return state.projects.find(p => p.id === id); }

function getDefaultProject() {
  return state.projects.find(p => p.isDefault && !p.archived)
    || state.projects.find(p => p.isDefault)
    || state.projects.find(p => !p.archived)
    || state.projects[0]
    || null;
}

function applyDefaultProjectFilterIfNeeded() {
  const f = state.ui.taskFilters;
  if (!f.defaultApplied) {
    const def = state.projects.find(p => p.isDefault && !p.archived) || state.projects.find(p => p.isDefault);
    if (def) f.projectId = def.id;
    f.defaultApplied = true;
  }
}

function isTaskPlanned(task) {
  if (!task) return false;
  if (task.plannedStatus === 'planned') return true;
  if (task.plannedStatus === 'nonplanned') return false;
  return Boolean((task.plannedDate && task.plannedDate.trim()) || (task.plannedStartTime && task.plannedStartTime.trim()) || Number(task.estimatedHours || 0) > 0);
}

function getTask(id) { return state.tasks.find(t => t.id === id); }
function getStage(project, stageId) {
  if (!project || !stageId) return null;
  return (project.stages || []).find(s => s.id === stageId);
}

function isTaskBillable(task) {
  if (!task) return false;
  if (task.billableOverride === 'billable') return true;
  if (task.billableOverride === 'nonbillable') return false;
  const proj = getProject(task.projectId);
  return proj ? !!proj.billable : false;
}

function isTaskBlockedByUnfinished(task) {
  if (!task || !task.blockedByTaskId) return null;
  const blocker = getTask(task.blockedByTaskId);
  if (blocker && blocker.status !== 'Done') return blocker;
  return null;
}

function getActualSecondsForTask(taskId, includeSubtasks = true) {
  let total = 0;
  state.timeEntries.forEach(e => {
    if (e.taskId === taskId) {
      if (includeSubtasks || !e.subtaskId) total += (e.durationSeconds || 0);
    }
  });
  if (state.activeTimer && state.activeTimer.taskId === taskId) {
    if (includeSubtasks || !state.activeTimer.subtaskId) {
      total += Math.max(0, Math.floor((Date.now() - state.activeTimer.startedAt) / 1000));
    }
  }
  return total;
}

function getActualSecondsForSubtask(taskId, subtaskId) {
  let total = 0;
  state.timeEntries.forEach(e => {
    if (e.taskId === taskId && e.subtaskId === subtaskId) total += (e.durationSeconds || 0);
  });
  if (state.activeTimer && state.activeTimer.taskId === taskId && state.activeTimer.subtaskId === subtaskId) {
    total += Math.max(0, Math.floor((Date.now() - state.activeTimer.startedAt) / 1000));
  }
  return total;
}

function formatDuration(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}

function formatClock(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function formatHoursNum(sec) {
  return (sec / 3600).toFixed(2);
}

function statusBadgeClass(status) {
  if (status === 'In progress') return 'b-progress';
  if (status === 'Blocked') return 'b-blocked';
  if (status === 'Done') return 'b-done';
  return 'b-todo';
}

function priorityBadgeClass(prio) {
  if (prio === 'High') return 'b-high';
  if (prio === 'Medium') return 'b-medium';
  return 'b-low';
}

// ===================== TIMER ENGINE =====================
function startTimer(taskId, subtaskId = null) {
  // Stop any currently running timer first
  if (state.activeTimer) {
    stopActiveTimer(true);
  }
  state.activeTimer = {
    taskId,
    subtaskId: subtaskId || null,
    startedAt: Date.now()
  };
  saveState();
  updateTimerUI();
  render();
  showToast('Timer started');
}

function roundUpTo15MinBlock(elapsedSec) {
  const FIFTEEN_MIN_SEC = 15 * 60;
  const safeElapsed = Math.max(1, Math.floor(elapsedSec || 0));
  return Math.ceil(safeElapsed / FIFTEEN_MIN_SEC) * FIFTEEN_MIN_SEC;
}

function stopActiveTimer(silent = false) {
  if (!state.activeTimer) return;
  const { taskId, subtaskId, startedAt } = state.activeTimer;
  const rawElapsedSec = Math.max(1, Math.floor((Date.now() - startedAt) / 1000));
  const roundedSec = roundUpTo15MinBlock(rawElapsedSec);
  const task = getTask(taskId);
  let category = task ? task.category : 'Administrative';
  let note = `Tracked via timer (${formatDuration(rawElapsedSec)} actual → ${formatDuration(roundedSec)})`;
  if (task && subtaskId) {
    const sub = (task.subtasks || []).find(s => s.id === subtaskId);
    if (sub) {
      category = sub.category || category;
      note = `Subtask: ${sub.title} (${formatDuration(rawElapsedSec)} actual → ${formatDuration(roundedSec)})`;
    }
  }
  if (task) {
    state.timeEntries.unshift({
      id: uid('time'),
      projectId: task.projectId,
      taskId: task.id,
      subtaskId: subtaskId || null,
      category,
      billable: isTaskBillable(task),
      date: todayStr(),
      durationSeconds: roundedSec,
      note
    });
  }
  state.activeTimer = null;
  saveState();
  updateTimerUI();
  if (!silent) {
    render();
    showToast(`Logged ${formatDuration(roundedSec)} (rounded up from ${formatDuration(rawElapsedSec)})`);
  }
}

function isTimerRunningFor(taskId, subtaskId = null) {
  if (!state.activeTimer) return false;
  return state.activeTimer.taskId === taskId && (state.activeTimer.subtaskId || null) === (subtaskId || null);
}

function updateTimerUI() {
  const pill = document.getElementById('activeTimerPill');
  if (!state.activeTimer) {
    pill.classList.remove('visible');
    return;
  }
  const task = getTask(state.activeTimer.taskId);
  let label = task ? task.title : 'Task';
  if (task && state.activeTimer.subtaskId) {
    const sub = (task.subtasks || []).find(s => s.id === state.activeTimer.subtaskId);
    if (sub) label = `${task.title} → ${sub.title}`;
  }
  if (label.length > 34) label = label.slice(0, 34) + '…';
  document.getElementById('activeTimerLabel').textContent = label;
  const elapsed = Math.floor((Date.now() - state.activeTimer.startedAt) / 1000);
  document.getElementById('activeTimerClock').textContent = formatClock(elapsed);
  pill.classList.add('visible');
}

setInterval(() => {
  if (state.activeTimer) updateTimerUI();
}, 1000);

// ===================== BACKUP & RESTORE =====================
function exportBackup() {
  const data = {
    exportedAt: new Date().toISOString(),
    app: 'Cadence Personal Work Manager',
    version: 1,
    projects: state.projects,
    tasks: state.tasks,
    notes: state.notes,
    timeEntries: state.timeEntries,
    calendarEvents: state.calendarEvents,
    assignees: state.assignees,
    savedTaskFilters: state.savedTaskFilters,
    defaultTaskFilter: state.defaultTaskFilter,
    settings: state.settings
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cadence-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Backup file downloaded');
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks)) {
        alert('This file does not look like a valid Cadence backup.');
        return;
      }
      if (!confirm('Importing this backup will replace your current data in this browser. Continue?')) return;
      state.projects = parsed.projects || [];
      state.tasks = parsed.tasks || [];
      state.notes = parsed.notes || [];
      state.timeEntries = parsed.timeEntries || [];
      state.calendarEvents = parsed.calendarEvents || [];
      state.assignees = parsed.assignees || [];
      syncAssigneesFromTasks();
      state.savedTaskFilters = parsed.savedTaskFilters || [];
      state.defaultTaskFilter = parsed.defaultTaskFilter || null;
      state.settings = Object.assign({ jiraBaseUrl: '', supportTool: 'Zendesk', supportBaseUrl: '', slackWebhookUrl: '', slackNotifyCreated: true, slackNotifyCompleted: true, slackNotifyOverdue: true, proxyUrl: '', calendarIcsUrl: '', jiraEmail: '', jiraApiToken: '', jiraDefaultProjectKey: '', jiraIssueType: 'Task', jiraAutoSyncWorklogs: false, categories: null }, parsed.settings || {});
      state.activeTimer = null;
      state.ui.taskFilters.defaultApplied = false;
      applyDefaultTaskFilterOnLoad();
      saveState();
      updateTimerUI();
      render();
      showToast('Backup restored successfully');
    } catch (err) {
      alert('Could not read the backup file. Make sure it is a valid .json backup.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function confirmResetData() {
  if (!confirm('Are you sure you want to delete ALL projects, tasks, notes, and time entries? Export a backup first if you want to keep them.')) return;
  state.projects = [];
  state.tasks = [];
  state.notes = [];
  state.timeEntries = [];
  state.calendarEvents = [];
  state.assignees = [];
  state.savedTaskFilters = [];
  state.defaultTaskFilter = null;
  state.activeTimer = null;
  saveState();
  updateTimerUI();
  render();
  showToast('All data cleared');
}

                        ${running
                          ? `<button class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
                          : `<button class="btn btn-xs" onclick="startTimer('${item.taskId}', ${item.subtaskId ? `'${item.subtaskId}'` : 'null'})">▶ Start</button>`}
                        <button class="btn btn-xs btn-success" onclick="openQuickLogActualModal('${item.taskId}', ${item.subtaskId ? `'${item.subtaskId}'` : 'null'})" title="Mark planned time as actual (with option to adjust if it ran shorter or longer)">✓ Log Actual</button>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>

    <div class="grid-3">
      <div class="card">
        <div class="card-header"><div class="card-title" style="color:var(--danger)">🔥 Overdue (${overdue.length})</div></div>
        ${overdue.length ? overdue.map(t => renderCompactTaskCard(t)).join('') : '<div class="empty-state">No overdue tasks. Nice work!</div>'}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">📌 Due Today (${dueToday.length})</div></div>
        ${dueToday.length ? dueToday.map(t => renderCompactTaskCard(t)).join('') : '<div class="empty-state">No tasks due today.</div>'}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title" style="color:var(--info)">⚡ In Progress (${inProgress.length})</div></div>
        ${inProgress.length ? inProgress.map(t => renderCompactTaskCard(t)).join('') : '<div class="empty-state">No tasks marked In progress.</div>'}
      </div>
    </div>
  `;
}

function renderCompactTaskCard(t) {
  const proj = getProject(t.projectId);
  const blocker = isTaskBlockedByUnfinished(t);
  const running = isTimerRunningFor(t.id, null);
  const actualH = (getActualSecondsForTask(t.id, true) / 3600).toFixed(1);
  const estH = Number(t.estimatedHours || 0).toFixed(1);
  return `
    <div class="task-item" style="padding:11px 12px;">
      <div class="task-title-row">
        <input type="checkbox" ${t.status === 'Done' ? 'checked' : ''} onchange="toggleTaskDone('${t.id}')" title="Mark task Done / To do" />
        <span class="task-title ${t.status === 'Done' ? 'done' : ''}" style="font-size:0.9rem;">${esc(t.title)}</span>
        ${blocker ? `<span class="badge b-warn" title="Blocked by unfinished task: ${esc(blocker.title)}">⚠️ Blocked</span>` : ''}
      </div>
      <div class="task-meta">
        <span>📁 ${esc(proj ? proj.name : 'No project')}</span>
        <span class="badge b-cat">${esc(t.category)}</span>
        ${t.assignee ? `<span class="badge b-assignee">👤 ${esc(t.assignee)}</span>` : ''}
        <span class="badge ${priorityBadgeClass(t.priority)}">${esc(t.priority)}</span>
        ${t.recurrence && t.recurrence !== 'none' ? `<span class="badge b-todo" title="Repeats ${esc(t.recurrence)}">🔁 ${esc(t.recurrence)}</span>` : ''}
        <span title="Planned vs Actual hours">⏱ ${estH}h est / ${actualH}h act</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        ${running
          ? `<button class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
          : `<button class="btn btn-xs" onclick="startTimer('${t.id}')">▶ Timer</button>`}
        <button class="btn btn-xs" onclick="openTaskModal('${t.id}')">Edit</button>
      </div>
    </div>
  `;
}

function renderStagesEditor() {
  const wrap = document.getElementById('stagesEditor');
  if (!wrap) return;
  wrap.innerHTML = tempProjectStages.map((s, i) => `
    <div class="stage-chip-row">
      <input type="text" value="${esc(s.name)}" oninput="tempProjectStages[${i}].name=this.value" placeholder="Stage name" required />
      <button type="button" class="btn btn-xs" onclick="moveTempStage(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
      <button type="button" class="btn btn-xs" onclick="moveTempStage(${i}, 1)" ${i === tempProjectStages.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
      <button type="button" class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="removeTempStage(${i})" ${tempProjectStages.length <= 1 ? 'disabled' : ''} title="Delete stage">✕</button>
    </div>
  `).join('');
}

function addTempStage() {
  tempProjectStages.push({ id: uid('stg'), name: '' });
  renderStagesEditor();
}
function moveTempStage(idx, dir) {
  const target = idx + dir;
  if (target < 0 || target >= tempProjectStages.length) return;
  const [item] = tempProjectStages.splice(idx, 1);
  tempProjectStages.splice(target, 0, item);
  renderStagesEditor();
}
function removeTempStage(idx) {
  if (tempProjectStages.length <= 1) return;
  tempProjectStages.splice(idx, 1);
  renderStagesEditor();
}

function saveProjectForm(e, projectId) {
  e.preventDefault();
  const cleanStages = tempProjectStages
    .map(s => ({ id: s.id, name: (s.name || '').trim() }))
    .filter(s => s.name);
  if (cleanStages.length === 0) {
    alert('Please keep at least one stage.');
    return;
  }
  const billable = document.getElementById('pBillable').value === 'true';
  const isDefault = Boolean(document.getElementById('pIsDefault')?.checked);
  if (isDefault) {
    state.projects.forEach(pr => { pr.isDefault = false; });
  }
  const payload = {
    name: document.getElementById('pName').value.trim(),
    client: document.getElementById('pClient').value.trim(),
    jiraLink: (document.getElementById('pJiraLink')?.value || '').trim(),
    slackLink: (document.getElementById('pSlackLink')?.value || '').trim(),
    repoLink: (document.getElementById('pRepoLink')?.value || '').trim(),
    description: document.getElementById('pDesc').value.trim(),
    status: document.getElementById('pStatus').value,
    isDefault,
    billable,
    hourlyRate: billable ? Number(document.getElementById('pRate').value || 0) : 0,
    stages: cleanStages
  };

  if (projectId) {
    const p = getProject(projectId);
    Object.assign(p, payload);
    if (isDefault) state.ui.taskFilters.projectId = p.id;
    showToast('Project updated');
  } else {
    const newProj = { id: uid('proj'), archived: false, ...payload };
    state.projects.push(newProj);
    if (isDefault) state.ui.taskFilters.projectId = newProj.id;
    showToast('Project created');
  }
  saveState();
  closeModal();
  render();
}


function setDefaultProject(projectId) {
  state.projects.forEach(p => { p.isDefault = (p.id === projectId); });
  state.ui.taskFilters.projectId = projectId;
  state.ui.taskFilters.stageId = '';
  saveState();
  render();
  const p = getProject(projectId);
  showToast(`⭐ "${p ? p.name : 'Project'}" set as default`);
}

function toggleArchiveProject(id) {
  const p = getProject(id);
  if (!p) return;
  p.archived = !p.archived;
  saveState();
  render();
  showToast(p.archived ? 'Project archived' : 'Project unarchived');
}

function deleteProject(id) {
  const taskCount = state.tasks.filter(t => t.projectId === id).length;
  if (!confirm(`Delete this project${taskCount ? ` and its ${taskCount} task(s)` : ''}? This cannot be undone.`)) return;
  state.projects = state.projects.filter(p => p.id !== id);
  state.tasks = state.tasks.filter(t => t.projectId !== id);
  saveState();
  render();
  showToast('Project deleted');
}

// ===================== 3. TASKS VIEW (LIST & KANBAN) =====================
function syncAssigneesFromTasks() {
  if (!Array.isArray(state.assignees)) state.assignees = [];
  const knownLower = new Set(state.assignees.map(a => (a.name || '').trim().toLowerCase()).filter(Boolean));
  const addIfNew = (rawName) => {
    const clean = (rawName || '').trim();
    if (!clean) return;
    const key = clean.toLowerCase();
    if (!knownLower.has(key)) {
      knownLower.add(key);
      state.assignees.push({ id: uid('asg'), name: clean, email: '', team: '', leftOrg: false });
    }
  };
  state.tasks.forEach(t => {
    addIfNew(t.assignee);
    (t.subtasks || []).forEach(s => addIfNew(s.assignee));
  });
}

function ensureAssigneeRecord(rawName) {
  const clean = (rawName || '').trim();
  if (!clean) return null;
  if (!Array.isArray(state.assignees)) state.assignees = [];
  let found = state.assignees.find(a => (a.name || '').trim().toLowerCase() === clean.toLowerCase());
  if (!found) {
    found = { id: uid('asg'), name: clean, email: '', team: '', leftOrg: false };
    state.assignees.push(found);
  }
  return found;
}

function getAssigneeMeta(rawName) {
  const clean = (rawName || '').trim();
  if (!clean || !Array.isArray(state.assignees)) return null;
  return state.assignees.find(a => (a.name || '').trim().toLowerCase() === clean.toLowerCase()) || null;
}

function getAllAssignees(includeLeft = true) {
  syncAssigneesFromTasks();
  return state.assignees
    .filter(a => includeLeft ? true : !a.leftOrg)
    .map(a => a.name)
    .sort((a, b) => a.localeCompare(b));
}

function getAllTeams() {
  syncAssigneesFromTasks();
  const set = new Set();
  state.assignees.forEach(a => {
    if (a.team && a.team.trim()) set.add(a.team.trim());
  });
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}


function captureTaskFilterSnapshot() {
  const f = state.ui.taskFilters || {};
  return {
    search: f.search || '',
    projectId: f.projectId || '',
    stageId: f.stageId || '',
    category: f.category || '',
    status: f.status !== undefined ? f.status : '__open__',
    priority: f.priority || '',
    due: f.due || '',
    assignees: Array.isArray(f.assignees) ? [...f.assignees] : [],
    team: f.team || '',
    planned: f.planned || ''
  };
}

function applyDefaultTaskFilterOnLoad() {
  const f = state.ui.taskFilters;
  if (f.defaultApplied) return;
  if (state.defaultTaskFilter && state.defaultTaskFilter.filters) {
    Object.assign(f, JSON.parse(JSON.stringify(state.defaultTaskFilter.filters)));
    f.defaultApplied = true;
    return;
  }
  applyDefaultProjectFilterIfNeeded();
}

function saveCurrentFiltersAsDefault() {
  const snap = captureTaskFilterSnapshot();
  state.defaultTaskFilter = {
    savedAt: new Date().toISOString(),
    filters: snap
  };
  saveState();
  render();
  showToast('⭐ Current task filters saved as default');
}

function clearSavedDefaultTaskFilter() {
  if (!state.defaultTaskFilter) return;
  state.defaultTaskFilter = null;
  saveState();
  render();
  showToast('Saved default filter cleared');
}

function openSaveFilterPresetModal(presetId = null) {
  const existing = presetId ? (state.savedTaskFilters || []).find(p => p.id === presetId) : null;
  const snap = existing ? existing.filters : captureTaskFilterSnapshot();
  const summaryParts = [];
  if (snap.projectId) {
    const pr = getProject(snap.projectId);
    summaryParts.push(`Project: ${pr ? pr.name : snap.projectId}`);
  }
  if (snap.stageId) summaryParts.push('Stage filtered');
  if (snap.category) summaryParts.push(`Category: ${snap.category}`);
  if (snap.status && snap.status !== '__open__') summaryParts.push(`Status: ${snap.status}`);
  else if (snap.status === '__open__') summaryParts.push('Open statuses');
  if (snap.team) summaryParts.push(`Team: ${snap.team === '__unassigned__' ? 'No Team' : snap.team}`);
  if (snap.planned) summaryParts.push(`Type: ${snap.planned}`);
  if (snap.assignees && snap.assignees.length) summaryParts.push(`Assignees: ${snap.assignees.join(', ')}`);
  if (snap.priority) summaryParts.push(`Priority: ${snap.priority}`);
  if (snap.due) summaryParts.push(`Due: ${snap.due}`);
  if (snap.search) summaryParts.push(`Search: "${snap.search}"`);

  openModal(`
    <div class="modal-header">
      <h3>${existing ? 'Edit Saved Filter' : 'Save Filter with Description'}</h3>
      <button class="btn btn-xs btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <p class="field-hint" style="margin-bottom:12px;">
      Active filter snapshot: <strong>${esc(summaryParts.length ? summaryParts.join(' • ') : 'All / Default criteria')}</strong>
    </p>
    <form onsubmit="saveFilterPresetForm(event, '${existing ? existing.id : ''}')">
      <div class="form-group">
        <label>Filter Label / Name *</label>
        <input type="text" id="fpName" required value="${esc(existing?.name || '')}" placeholder="e.g. Urgent Client Bugs" />
      </div>
      <div class="form-group">
        <label>Description *</label>
        <textarea id="fpDesc" required placeholder="Describe what tasks this filter shows (e.g. High-priority open Jira tasks for Platform team)">${esc(existing?.description || '')}</textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Filter</button>
      </div>
    </form>
  `);
}

function saveFilterPresetForm(e, presetId) {
  e.preventDefault();
  const name = (document.getElementById('fpName')?.value || '').trim();
  const description = (document.getElementById('fpDesc')?.value || '').trim();
  if (!name || !description) return;
  if (!Array.isArray(state.savedTaskFilters)) state.savedTaskFilters = [];

  if (presetId) {
    const found = state.savedTaskFilters.find(x => x.id === presetId);
    if (found) {
      found.name = name;
      found.description = description;
      showToast('Saved filter updated');
    }
  } else {
    const created = {
      id: uid('flt'),
      name,
      description,
      filters: captureTaskFilterSnapshot()
    };
    state.savedTaskFilters.push(created);
    state.ui.activeTaskPresetId = created.id;
    showToast(`Saved filter "${name}"`);
  }
  saveState();
  closeModal();
  render();
}

function applySavedTaskPreset(presetId) {
  const preset = (state.savedTaskFilters || []).find(x => x.id === presetId);
  if (!preset || !preset.filters) return;
  const f = state.ui.taskFilters;
  Object.assign(f, JSON.parse(JSON.stringify(preset.filters)));
  f.defaultApplied = true;
  state.ui.activeTaskPresetId = preset.id;
  render();
  showToast(`Applied "${preset.name}"`);
}

function deleteSavedTaskPreset(presetId) {
  state.savedTaskFilters = (state.savedTaskFilters || []).filter(x => x.id !== presetId);
  if (state.ui.activeTaskPresetId === presetId) state.ui.activeTaskPresetId = '';
  saveState();
  render();
  showToast('Saved filter removed');
}

function getSelectedAssignees() {
  const arr = state.ui.taskFilters.assignees;
  return Array.isArray(arr) ? arr : [];
}

function toggleAssigneeSelection(val) {
  if (!Array.isArray(state.ui.taskFilters.assignees)) state.ui.taskFilters.assignees = [];
  const idx = state.ui.taskFilters.assignees.findIndex(x => x.toLowerCase() === val.toLowerCase());
  if (idx >= 0) {
    state.ui.taskFilters.assignees.splice(idx, 1);
  } else {
    state.ui.taskFilters.assignees.push(val);
  }
  render();
}

function filterByTeamName(teamName) {
  state.ui.taskFilters.team = (state.ui.taskFilters.team === teamName) ? '' : teamName;
  render();
}

function matchesAssigneeToken(rawName, token) {
  const clean = (rawName || '').trim();
  if (token === '__me__') return !clean;
  if (token === '__delegated__') return Boolean(clean);
  return clean.toLowerCase() === token.toLowerCase();
}

function getEarliestTaskSortDate(t) {
  const dates = [];
  if (t.dueDate) dates.push(t.dueDate);
  if (t.plannedDate) dates.push(t.plannedDate);
  (t.subtasks || []).forEach(s => {
    if (s.status !== 'Done') {
      if (s.dueDate) dates.push(s.dueDate);
      if (s.plannedDate) dates.push(s.plannedDate);
    }
  });
  if (dates.length === 0) return '9999-12-31';
  dates.sort();
  return dates[0];
}

function getFilteredTasks() {
  const f = state.ui.taskFilters;
  const today = todayStr();
  const weekEnd = addDaysStr(7);
  const selectedAssignees = getSelectedAssignees();

  const filtered = state.tasks.filter(t => {
    if (f.projectId && t.projectId !== f.projectId) return false;
    if (f.stageId && t.stageId !== f.stageId) return false;
    if (f.category && t.category !== f.category) return false;
    if (f.status === '__open__' && t.status === 'Done') return false;
    if (f.status && f.status !== '__open__' && t.status !== f.status) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (f.planned === 'planned' && !isTaskPlanned(t)) return false;
    if (f.planned === 'nonplanned' && isTaskPlanned(t)) return false;
    if (f.team) {
      const matchesTeam = (rawName) => {
        const clean = (rawName || '').trim();
        if (!clean) return f.team === '__unassigned__';
        const meta = getAssigneeMeta(clean);
        const teamName = (meta?.team || '').trim();
        if (f.team === '__unassigned__') return !teamName;
        return teamName === f.team;
      };
      const taskMatches = matchesTeam(t.assignee);
      const subMatches = (t.subtasks || []).some(s => matchesTeam(s.assignee));
      if (!taskMatches && !subMatches) return false;
    }
    if (selectedAssignees.length > 0) {
      const matchesAnySelected = selectedAssignees.some(token => {
        const taskMatch = matchesAssigneeToken(t.assignee, token);
        const subMatch = (t.subtasks || []).some(s => matchesAssigneeToken(s.assignee, token));
        return taskMatch || subMatch;
      });
      if (!matchesAnySelected) return false;
    }
    if (f.due === 'overdue' && !(t.dueDate && t.dueDate < today && t.status !== 'Done')) return false;
    if (f.due === 'today' && t.dueDate !== today) return false;
    if (f.due === 'week' && !(t.dueDate && t.dueDate >= today && t.dueDate <= weekEnd)) return false;
    if (f.due === 'none' && t.dueDate) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      const hay = `${t.title} ${(t.description || '').replace(/<[^>]+>/g, ' ')} ${t.assignee || ''} ${t.externalRef || ''} ${(t.subtasks||[]).map(s=>`${s.title} ${(s.description || '').replace(/<[^>]+>/g, ' ')} ${s.assignee || ''}`).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // Sort by earliest due or planned date ascending (tasks without dates placed last)
  return filtered.sort((a, b) => {
    const da = getEarliestTaskSortDate(a);
    const db = getEarliestTaskSortDate(b);
    if (da !== db) return da.localeCompare(db);
    return (a.title || '').localeCompare(b.title || '');
  });
}

function computeAssigneeStats(matchFn, today) {
  let total = 0, done = 0, overdue = 0, blocked = 0;
  state.tasks.forEach(t => {
    if (matchFn((t.assignee || '').trim())) {
      total++;
      if (t.status === 'Done') done++;
      else {
        if (t.dueDate && t.dueDate < today) overdue++;
        if (t.status === 'Blocked') blocked++;
      }
    }
    (t.subtasks || []).forEach(s => {
      if (matchFn((s.assignee || '').trim())) {
        total++;
        if (s.status === 'Done') done++;
        else {
          if (s.dueDate && s.dueDate < today) overdue++;
          if (s.status === 'Blocked') blocked++;
        }
      }
    });
  });
  return { total, done, open: total - done, overdue, blocked };
}

function buildAssigneeTileHtml({ idVal, labelText, icon, teamText, leftOrg, stats, isSelected, onClickExpr, titleText }) {
  const pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
  const safeTeam = esc(teamText || '').replace(/'/g, "\\'");
  return `
    <div class="colleague-card ${isSelected ? 'active' : ''}"
      style="${leftOrg ? 'opacity:0.75;border-style:dashed;' : ''}"
      onclick="${onClickExpr}"
      title="${esc(titleText)}">
      <div class="colleague-card-top">
        <span class="colleague-card-check">
          <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation();${onClickExpr}" title="Select/deselect ${esc(labelText)}" />
          <span>${icon} ${esc(labelText)}</span>
        </span>
        <span style="font-size:0.76rem;color:var(--primary);">${pct}%</span>
      </div>
      ${(teamText || leftOrg) ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">
        ${teamText ? `<span class="badge b-cat clickable-team-badge" style="font-size:0.68rem;" onclick="event.stopPropagation();filterByTeamName('${safeTeam}')" title="Click to filter tasks & subtasks for team ${esc(teamText)}">🏷️ ${esc(teamText)}</span>` : ''}
        ${leftOrg ? `<span class="badge b-blocked" style="font-size:0.68rem;">Left org</span>` : ''}
      </div>` : ''}
      <div class="progress-track" style="max-width:100%;height:6px;">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="colleague-stats">
        <span><strong>${stats.open}</strong> open</span>
        <span><strong>${stats.done}</strong>/${stats.total} done</span>
        ${stats.overdue ? `<span style="color:var(--danger);font-weight:700;">🔥 ${stats.overdue} overdue</span>` : ''}
        ${stats.blocked ? `<span style="color:var(--warning);font-weight:700;">⛔ ${stats.blocked} blocked</span>` : ''}
      </div>
    </div>
  `;
}

function renderAssigneeProgressStrip() {
  syncAssigneesFromTasks();
  const today = todayStr();
  const selectedList = getSelectedAssignees();
  const teamFilter = state.ui.taskFilters.team || '';
  const isSelectedFn = (val) => selectedList.some(x => x.toLowerCase() === val.toLowerCase());

  const meStats = computeAssigneeStats(name => !name, today);
  const showMe = !teamFilter || teamFilter === '__unassigned__';
  const meTile = showMe ? buildAssigneeTileHtml({
    idVal: '__me__',
    labelText: 'Me',
    icon: '🙋',
    teamText: '',
    leftOrg: false,
    stats: meStats,
    isSelected: isSelectedFn('__me__'),
    onClickExpr: "toggleAssigneeSelection('__me__')",
    titleText: 'Toggle filter for tasks/subtasks assigned to Me'
  }) : '';

  const sortedAssignees = [...state.assignees].sort((a, b) => {
    if (!!a.leftOrg !== !!b.leftOrg) return a.leftOrg ? 1 : -1;
    return a.name.localeCompare(b.name);
  });

  const personTiles = sortedAssignees
    .filter(a => {
      if (teamFilter) {
        const tName = (a.team || '').trim();
        if (teamFilter === '__unassigned__' && tName) return false;
        if (teamFilter !== '__unassigned__' && tName !== teamFilter) return false;
      }
      const stats = computeAssigneeStats(n => n.toLowerCase() === a.name.toLowerCase(), today);
      if (a.leftOrg && stats.total === 0 && !isSelectedFn(a.name)) return false;
      return true;
    })
    .map(a => {
      const stats = computeAssigneeStats(n => n.toLowerCase() === a.name.toLowerCase(), today);
      const isSelected = isSelectedFn(a.name);
      const safeName = esc(a.name).replace(/'/g, "\\'");
      return buildAssigneeTileHtml({
        idVal: a.name,
        labelText: a.name,
        icon: a.leftOrg ? '🚪' : '👤',
        teamText: a.team || '',
        leftOrg: !!a.leftOrg,
        stats,
        isSelected,
        onClickExpr: `toggleAssigneeSelection('${safeName}')`,
        titleText: `Toggle filter for tasks/subtasks assigned to ${a.name}${a.team ? ' (' + a.team + ')' : ''}${a.leftOrg ? ' — Left organisation' : ''}`
      });
    }).join('');

  return `
    <div style="margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
      <span style="font-size:0.78rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;">
        👥 Assignees (check one or more to filter • click team tag for team tasks)
      </span>
      ${(selectedList.length > 0 || teamFilter) ? `<button class="btn btn-xs btn-ghost" onclick="state.ui.taskFilters.assignees=[];state.ui.taskFilters.team='';render()">Clear assignee/team filter</button>` : ''}
    </div>
    <div class="colleague-strip">${meTile}${personTiles}</div>
  `;
}

function refreshTaskResults() {
  const box = document.getElementById('taskResultsContainer');
  if (!box) return;
  const tasks = getFilteredTasks();
  box.innerHTML = state.ui.taskViewMode === 'list' ? renderTaskList(tasks) : renderKanban(tasks);
}

function clearTaskFilters() {
  state.ui.taskFilters = { search: '', projectId: '', stageId: '', category: '', status: '__open__', priority: '', due: '', assignees: [], team: '', planned: '', defaultApplied: true };
  state.ui.activeTaskPresetId = '';
  render();
}

function renderTaskList(tasks) {
  if (tasks.length === 0) {
    return `<div class="card empty-state">No tasks match your filters. Click <strong>+ New Task</strong> to add one.</div>`;
  }
  const selectedAssignees = getSelectedAssignees();
  const teamFilter = state.ui.taskFilters.team || '';
  const hasAssigneeOrTeamFilter = selectedAssignees.length > 0 || Boolean(teamFilter);

  const doesSubMatchFilter = (s) => {
    if (!hasAssigneeOrTeamFilter) return false;
    let ok = true;
    if (selectedAssignees.length > 0) {
      ok = ok && selectedAssignees.some(tok => matchesAssigneeToken(s.assignee, tok));
    }
    if (teamFilter) {
      const clean = (s.assignee || '').trim();
      if (!clean) ok = ok && (teamFilter === '__unassigned__');
      else {
        const tm = (getAssigneeMeta(clean)?.team || '').trim();
        ok = ok && (teamFilter === '__unassigned__' ? !tm : tm === teamFilter);
      }
    }
    return ok;
  };

  return tasks.map(t => {
    const proj = getProject(t.projectId);
    const stage = getStage(proj, t.stageId);
    const blocker = isTaskBlockedByUnfinished(t);
    const billable = isTaskBillable(t);
    const plannedFlag = isTaskPlanned(t);
    const allSubs = t.subtasks || [];
    const matchingSubs = hasAssigneeOrTeamFilter ? allSubs.filter(doesSubMatchFilter) : [];
    const subs = (hasAssigneeOrTeamFilter && matchingSubs.length > 0) ? matchingSubs : allSubs;
    const doneSubs = allSubs.filter(s => s.status === 'Done').length;
    const pct = allSubs.length ? Math.round((doneSubs / allSubs.length) * 100) : 0;
    const running = isTimerRunningFor(t.id, null);
    const actualSec = getActualSecondsForTask(t.id, true);
    const tAssigneeMeta = t.assignee ? getAssigneeMeta(t.assignee) : null;
    const tTeam = (tAssigneeMeta?.team || '').trim();
    const safeTTeam = esc(tTeam).replace(/'/g, "\'");

    return `
      <div class="task-item">
        <div class="task-top">
          <div style="flex:1;min-width:240px;">
            <div class="task-title-row">
              <input type="checkbox" ${t.status === 'Done' ? 'checked' : ''} onchange="toggleTaskDone('${t.id}')" title="Toggle Done" />
              <span class="task-title ${t.status === 'Done' ? 'done' : ''}">${esc(t.title)}</span>
              <span class="badge ${statusBadgeClass(t.status)}">${esc(t.status)}</span>
              <span class="badge ${priorityBadgeClass(t.priority)}">${esc(t.priority)}</span>
              <span class="badge b-cat">${esc(t.category)}</span>
              <span class="badge ${plannedFlag ? 'b-progress' : 'b-todo'}" title="${plannedFlag ? 'Planned task' : 'Non-planned task'}">${plannedFlag ? '🗓️ Planned' : '📋 Non-planned'}</span>
              ${t.assignee ? `<span class="badge b-assignee" title="Assigned to: ${esc(t.assignee)}">👤 ${esc(t.assignee)}</span>` : ''}
              ${tTeam ? `<span class="badge b-cat clickable-team-badge" onclick="filterByTeamName('${safeTTeam}')" title="Click to show tasks & subtasks for team ${esc(tTeam)}">🏷️ ${esc(tTeam)}</span>` : ''}
              <span class="badge ${billable ? 'b-billable' : 'b-nonbillable'}">${billable ? '💲 Billable' : 'Non-billable'}</span>
              ${t.recurrence && t.recurrence !== 'none' ? `<span class="badge b-todo" title="Automatically creates next occurrence when marked Done">🔁 ${esc(t.recurrence)}</span>` : ''}
              ${blocker ? `<span class="badge b-warn" title="This task is blocked until '${esc(blocker.title)}' is marked Done">⚠️ Blocked by: ${esc(blocker.title)}</span>` : ''}
            </div>
            ${t.description ? `<div class="rte-rendered" style="font-size:0.84rem;color:var(--text-muted);margin-top:5px;">${sanitizeNoteHtml(t.description)}</div>` : ''}
            <div class="task-meta">
              <span>📁 ${esc(proj ? proj.name : 'Unknown')}${stage ? ` › ${esc(stage.name)}` : ''}</span>
              ${t.dueDate ? `<span>📅 Due: <strong>${esc(t.dueDate)}</strong></span>` : ''}
              ${t.plannedDate ? `<span>🗓 Planned: ${esc(t.plannedDate)}${t.plannedStartTime ? ` at ${esc(t.plannedStartTime)}` : ''}</span>` : ''}
              <span>⏱ Est: ${Number(t.estimatedHours || 0)}h • Actual: ${(actualSec/3600).toFixed(2)}h</span>
              ${t.externalRef ? `<span>🔗 Ref: <strong>${esc(t.externalRef)}</strong></span>` : ''}
            </div>
            ${renderIntegrationActions(t, null)}

            ${subs.length > 0 ? `
              <div class="progress-wrap">
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                <span class="progress-text">${doneSubs} of ${subs.length} subtasks done (${pct}%)</span>
              </div>
            ` : ''}
          </div>

          <div class="task-actions">
            ${running
              ? `<button class="btn btn-sm btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
              : `<button class="btn btn-sm" onclick="startTimer('${t.id}')" title="Start tracking time on this task">▶ Start</button>`}
            <button class="btn btn-sm" onclick="openSubtaskModal('${t.id}')" title="Break this task into smaller subtasks">+ Subtask</button>
            <button class="btn btn-sm" onclick="duplicateTask('${t.id}')" title="Make a copy of this task and its subtasks">📋 Copy</button>
            <button class="btn btn-sm" onclick="openTaskModal('${t.id}')">Edit</button>
            <button class="btn btn-sm btn-ghost" style="color:var(--danger)" onclick="deleteTask('${t.id}')">Delete</button>
          </div>
        </div>

        ${subs.length > 0 ? `
          <div class="subtasks-box">
            ${(hasAssigneeOrTeamFilter && matchingSubs.length > 0 && matchingSubs.length < allSubs.length) ? `<div style="font-size:0.75rem;color:var(--primary);font-weight:600;margin-bottom:6px;">Showing ${matchingSubs.length} matching subtask(s) of ${allSubs.length}</div>` : ''}
            ${subs.map(sub => {
              const subRunning = isTimerRunningFor(t.id, sub.id);
              const subAct = (getActualSecondsForSubtask(t.id, sub.id) / 3600).toFixed(2);
              const isMatchedSub = doesSubMatchFilter(sub);
              const sTeam = sub.assignee ? (getAssigneeMeta(sub.assignee)?.team || '').trim() : '';
              const safeSTeam = esc(sTeam).replace(/'/g, "\'");
              return `
                <div class="subtask-row ${isMatchedSub ? 'assignee-match' : ''}">
                  <div class="subtask-left">
                    <input type="checkbox" ${sub.status === 'Done' ? 'checked' : ''} onchange="toggleSubtaskDone('${t.id}','${sub.id}')" />
                    <span class="${sub.status === 'Done' ? 'task-title done' : ''}" style="font-weight:600;font-size:0.84rem;">${esc(sub.title)}</span>
                    ${sub.description ? `<span class="rte-rendered" style="font-size:0.78rem;color:var(--text-muted);">${sanitizeNoteHtml(sub.description)}</span>` : ''}
                    <span class="badge ${statusBadgeClass(sub.status)}">${esc(sub.status)}</span>
                    <span class="badge b-cat">${esc(sub.category || t.category)}</span>
                    ${sub.assignee ? `<span class="badge b-assignee" title="Assigned to: ${esc(sub.assignee)}">👤 ${esc(sub.assignee)}</span>` : ''}
                    ${sTeam ? `<span class="badge b-cat clickable-team-badge" onclick="filterByTeamName('${safeSTeam}')" title="Click to show tasks & subtasks for team ${esc(sTeam)}">🏷️ ${esc(sTeam)}</span>` : ''}
                    ${sub.dueDate ? `<span style="font-size:0.76rem;color:var(--text-muted)">Due ${esc(sub.dueDate)}</span>` : ''}
                    ${sub.plannedDate ? `<span style="font-size:0.76rem;color:var(--text-muted)">Planned ${esc(sub.plannedDate)} ${esc(sub.plannedStartTime || '')}</span>` : ''}
                    <span style="font-size:0.76rem;color:var(--text-muted)">Est ${Number(sub.estimatedHours||0)}h / Act ${subAct}h</span>
                    ${renderSubtaskDependencyBadge(sub)}
                  </div>
                  <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">
                    ${renderIntegrationActions(t, sub, true)}
                    ${subRunning
                      ? `<button class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
                      : `<button class="btn btn-xs" onclick="startTimer('${t.id}','${sub.id}')">▶ Start</button>`}
                    <button class="btn btn-xs" onclick="openMoveSubtaskModal('${t.id}','${sub.id}')" title="Move this subtask to its own project as a standalone task">📁 Move</button>
                    <button class="btn btn-xs" onclick="openSubtaskModal('${t.id}','${sub.id}')">Edit</button>
                    <button class="btn btn-xs btn-ghost" style="color:var(--danger)" onclick="deleteSubtask('${t.id}','${sub.id}')">✕</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function renderKanban(tasks) {
  return `
    <div class="kanban-grid">
      ${STATUSES.map(status => {
        const colTasks = tasks.filter(t => t.status === status);
        return `
          <div class="kanban-col"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="handleKanbanDrop(event, '${status}', this)">
            <div class="kanban-col-header">
              <span>${status}</span>
              <span class="badge ${statusBadgeClass(status)}">${colTasks.length}</span>
            </div>
            ${colTasks.map(t => {
              const proj = getProject(t.projectId);
              const blocker = isTaskBlockedByUnfinished(t);
              const subs = t.subtasks || [];
              const doneSubs = subs.filter(s => s.status === 'Done').length;
              return `
                <div class="kanban-card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}')">
                  <div style="font-weight:700;font-size:0.88rem;margin-bottom:6px;">
                    ${blocker ? '<span title="Blocked by ' + esc(blocker.title) + '">⚠️ </span>' : ''}${esc(t.title)}
                  </div>
                  <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
                    <span class="badge ${priorityBadgeClass(t.priority)}">${esc(t.priority)}</span>
                    <span class="badge b-cat">${esc(t.category)}</span>
                    ${t.assignee ? `<span class="badge b-assignee">👤 ${esc(t.assignee)}</span>` : ''}
                  </div>
                  <div style="font-size:0.76rem;color:var(--text-muted);margin-bottom:8px;">
                    📁 ${esc(proj ? proj.name : 'No project')}
                    ${t.dueDate ? ` • 📅 ${esc(t.dueDate)}` : ''}
                    ${subs.length ? ` • ☑ ${doneSubs}/${subs.length}` : ''}
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    ${isTimerRunningFor(t.id, null)
                      ? `<button class="btn btn-xs btn-danger" onclick="stopActiveTimer()">⏹ Stop</button>`
                      : `<button class="btn btn-xs" onclick="startTimer('${t.id}')">▶ Timer</button>`}
                    <button class="btn btn-xs btn-ghost" onclick="openTaskModal('${t.id}')">Edit</button>
                  </div>
                </div>
              `;
            }).join('') || '<div style="font-size:0.8rem;color:var(--text-muted);text-align:center;padding:20px 6px;">Drag tasks here</div>'}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function handleKanbanDrop(event, newStatus, colEl) {
  event.preventDefault();
  colEl.classList.remove('drag-over');
  const taskId = event.dataTransfer.getData('text/plain');
  const task = getTask(taskId);
  if (task && task.status !== newStatus) {
    const wasDone = task.status === 'Done';
    task.status = newStatus;
    if (!wasDone && newStatus === 'Done') spawnNextRecurringTask(task);
    saveState();
    render();
    showToast(`Moved to ${newStatus}`);
  }
}

function toggleTaskDone(taskId) {
  const t = getTask(taskId);
  if (!t) return;
  const wasDone = t.status === 'Done';
  t.status = wasDone ? 'To do' : 'Done';
  if (!wasDone && t.status === 'Done') {
    spawnNextRecurringTask(t);
    maybeAutoNotifySlack(t, null, 'completed');
  }
  saveState();
  render();
}

function toggleSubtaskDone(taskId, subId) {
  const t = getTask(taskId);
  if (!t) return;
  const s = (t.subtasks || []).find(x => x.id === subId);
  if (!s) return;
  const wasDone = s.status === 'Done';
  s.status = wasDone ? 'To do' : 'Done';
  if (!wasDone && s.status === 'Done') maybeAutoNotifySlack(t, s, 'completed');
  saveState();
  render();
}

  sec.style.display = show ? 'block' : 'none';
  btn.textContent = show ? '🔒 Hide Extra Fields' : '🔓 Show Extra Fields';

function populateStageDropdown(projectId, selectedStageId = '') {
  const proj = getProject(projectId);
  const sel = document.getElementById('tStage');
  if (!sel) return;
  const stages = proj?.stages || [];
  sel.innerHTML = `<option value="">None</option>` + stages.map(s =>
    `<option value="${s.id}" ${selectedStageId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`
  ).join('');
}

function updateCategoryFieldHints(cat, lblId, inpId, hintId, learnWrapId) {
  const lbl = document.getElementById(lblId);
  const inp = document.getElementById(inpId);
  const hint = document.getElementById(hintId);
  const learnWrap = document.getElementById(learnWrapId);
  if (learnWrap) learnWrap.style.display = (cat === 'Learning') ? 'block' : 'none';
  if (!lbl || !inp) return;
  if (cat === 'Slack') {
    lbl.textContent = 'Slack Message or Channel Link';
    inp.placeholder = 'e.g. https://yourteam.slack.com/archives/...';
    if (hint) hint.textContent = 'Enables "Open in Slack" and "Copy to Slack" buttons.';
  } else if (cat === 'Jira') {
    lbl.textContent = 'Jira Ticket Key or Full URL';
    inp.placeholder = 'e.g. ABC-123';
    if (hint) hint.textContent = 'Combines with your Base Jira URL in Settings for "Open in Jira".';
  } else if (cat === 'Support') {
    lbl.textContent = `Support Ticket Number or Link (${state.settings?.supportTool || 'Helpdesk'})`;
    inp.placeholder = 'e.g. 1042 or full ticket URL';
    if (hint) hint.textContent = 'Combines with your Helpdesk URL in Settings for "Open Ticket".';
  } else if (cat === 'Learning') {
    lbl.textContent = 'Course or Resource Link';
    inp.placeholder = 'e.g. https://www.coursera.org/... or YouTube link';
    if (hint) hint.textContent = 'Enables "Open Resource" button alongside your progress bar.';
  } else if (cat === 'Administrative') {
    lbl.textContent = 'Related Link (Google Doc, Sheet, Form, etc.)';
    inp.placeholder = 'e.g. https://docs.google.com/...';
    if (hint) hint.textContent = 'Enables a one-click "Open Link" button.';
  } else if (cat === 'Dependency') {
    lbl.textContent = 'External Blocker Link (optional: Jira, email, etc.)';
    inp.placeholder = 'e.g. https://... or ticket key';
    if (hint) hint.textContent = 'Pick the blocking task on the right, and optionally add an external link here.';
  } else {
    lbl.textContent = 'Reference Link / ID (optional)';
    inp.placeholder = 'Optional link or reference';
    if (hint) hint.textContent = '';
  }
}

function updateTaskCategoryHint() {
  const cat = document.getElementById('tCategory')?.value;
  updateCategoryFieldHints(cat, 'tExternalRefLabel', 'tExternalRef', 'tExternalRefHint', 'tLearningWrap');
}

function updateSubtaskCategoryHint() {
  const cat = document.getElementById('stCategory')?.value;
  updateCategoryFieldHints(cat, 'stExternalRefLabel', 'stExternalRef', 'stExternalRefHint', 'stLearningWrap');
}

function saveTaskForm(e, taskId) {
  e.preventDefault();
  const payload = {
    projectId: document.getElementById('tProject').value,
    stageId: document.getElementById('tStage').value,
    title: document.getElementById('tTitle').value.trim(),
    assignee: (document.getElementById('tAssignee')?.value || '').trim(),
    description: sanitizeNoteHtml(document.getElementById('tDesc')?.innerHTML || ''),
    status: document.getElementById('tStatus').value,
    priority: document.getElementById('tPriority').value,
    dueDate: document.getElementById('tDue').value,
    category: document.getElementById('tCategory').value,
    billableOverride: document.getElementById('tBillable').value,
    externalRef: document.getElementById('tExternalRef').value.trim(),
    blockedByTaskId: document.getElementById('tBlockedBy').value,
    plannedDate: document.getElementById('tPlannedDate').value,
    plannedStartTime: document.getElementById('tPlannedTime').value,
    estimatedHours: Number(document.getElementById('tEstHours').value || 0),
    plannedStatus: (function() {
      const selVal = document.getElementById('tPlannedStatus')?.value || 'nonplanned';
      const pDate = document.getElementById('tPlannedDate')?.value || '';
      if (pDate && selVal === 'nonplanned' && !taskId) return 'planned';
      return selVal;
    })(),
    learningProgress: Number(document.getElementById('tLearningProgress')?.value || 0),
    recurrence: document.getElementById('tRecurrence').value || 'none'
  };
  if (taskId) {
    const t = getTask(taskId);
    const wasDone = t.status === 'Done';
    Object.assign(t, payload);
    if (!wasDone && t.status === 'Done') {
      spawnNextRecurringTask(t);
      maybeAutoNotifySlack(t, null, 'completed');
    }
    showToast('Task updated');
  } else {
    const created = { id: uid('task'), subtasks: [], ...payload };
    state.tasks.unshift(created);
    maybeAutoNotifySlack(created, null, 'created');
    showToast('Task created');
  }
  if (payload.assignee) ensureAssigneeRecord(payload.assignee);
  saveState();
  closeModal();
  render();
}

function deleteTask(taskId) {
  if (!confirm('Delete this task and its subtasks?')) return;
  if (state.activeTimer && state.activeTimer.taskId === taskId) stopActiveTimer(true);
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  saveState();
  render();
  showToast('Task deleted');
}

              return `<option value="${esc(c)}">${meta?.team ? esc(meta.team) : ''}</option>`;
            }).join('')}
          </datalist>
        </div>
