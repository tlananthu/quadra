<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDS Ledger Workflow Chart</title>
  
  <!-- Font Setup: System Fonts aligned with Ellucian Path Guidelines -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin="">
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  
  <style>
    /* --- Ellucian Path Design System Tokens --- */
    :root {
      --eds-color-bg-main: #FAFBFC;
      --eds-color-surface: #FFFFFF;
      --eds-color-border: #E2E8F0;
      --eds-font-sans: 'Inter', sans-serif;
      --eds-text-muted: #64748B;

      /* Aligned Color Palette Tokens from Ledger Component */
      --eds-color-banner: darkblue;    /* Green */
      --eds-color-erp-bal: #9A3412;    /* Orange */
      --eds-color-net-pos: #6B21A8;    /* Purple */
      
      --eds-radius-sm: 4px;
      --eds-radius-md: 12px;
      --eds-shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--eds-color-bg-main);
      font-family: var(--eds-font-sans);
      margin: 0;
      padding: 2rem 1.5rem;
    }

    /* --- Container Architecture --- */
    .eds-chart-card {
      background-color: var(--eds-color-surface);
      border: 1px solid var(--eds-color-border);
      border-radius: var(--eds-radius-md);
      box-shadow: var(--eds-shadow-sm);
      padding: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .eds-chart-header {
      margin-bottom: 1.5rem;
    }

    .eds-chart-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
    }

    /* --- Chart Legend Component --- */
    .eds-chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--eds-color-border);
    }

    .eds-legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--eds-text-muted);
    }

    .eds-legend-color {
      width: 12px;
      height: 12px;
      border-radius: var(--eds-radius-sm);
    }

    /* --- Primary Chart Axis Canvas --- */
    .eds-chart-canvas {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: 320px; /* Target visualization height matrix */
      border-bottom: 2px solid #CBD5E1;
      padding-bottom: 0.5rem;
      overflow-x: auto;
      gap: 0.5rem;
    }

    /* --- Grouped Columns Structure --- */
    .eds-chart-day-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 70px;
      height: 100%;
      justify-content: flex-end;
    }

    .eds-bars-container {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 100%;
      width: 100%;
      padding: 0 4px;
    }

    /* Target Bar Element Utility styling */
    .eds-bar {
      flex: 1;
      border-radius: var(--eds-radius-sm) var(--eds-radius-sm) 0 0;
      min-height: 2px; /* Ensures zero value states show a pixel row hint */
      transition: height 0.3s ease, opacity 0.2s ease;
      position: relative;
      cursor: pointer;
    }

    .eds-bar:hover {
      opacity: 0.85;
    }

    /* Interactive Data Flyouts */
    .eds-bar::after {
      content: attr(data-value);
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0F172A;
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 4px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .eds-bar:hover::after {
      opacity: 1;
    }

    /* --- Timeline Horizontal Labels --- */
    .eds-day-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--eds-text-muted);
      margin-top: 0.5rem;
      text-align: center;
    }

    /* Semantic Color Mapping Classes */
    .bar--banner { background-color: var(--eds-color-banner); height: var(--h-rev); }
    .bar--erp { background-color: var(--eds-color-erp-bal); height: var(--h-erp); }
  </style>
  <style>
    /* --- Parent Flex Wrapper to force a Single Row --- */
.eds-dashboard-row {
  display: flex;
  flex-direction: row;
  width: 100%;
  max-width: 1600px; /* Optional: adjust based on your maximum layout allowance */
  margin: 0 auto;
  gap: 1.5rem; /* Space between the two charts */
  align-items: stretch; /* Forces both chart cards to be the exact same height */
}

/* --- Modify your existing container class to balance evenly --- */
.eds-container {
  flex: 1; /* Assigns equal width space to both charts dynamically */
  min-width: 0; /* Critical fix: prevents SVGs or grids from pushing widths out */
  max-width: 50%; /* Limits both containers to half the layout space */
}

/* --- Responsive Fallback (Optional) --- */
@media (max-width: 1024px) {
  .eds-dashboard-row {
    flex-direction: column; /* Stacks charts cleanly into rows on tablet/mobile screens */
  }
  .eds-container {
    max-width: 100%; /* Resets width allocation on smaller mobile screens */
  }
}

    /* --- Ellucian Path Corporate Token Sets --- */
    :root {
      --eds-color-bg-main: #F8FAFC;
      --eds-color-surface: #FFFFFF;
      --eds-color-border: #E2E8F0;
      --eds-color-grid-line: #F1F5F9;
      --eds-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --eds-text-primary: #0F172A;
      --eds-text-muted: #475569;

      /* Enterprise Metrics Branding Palettes */
      --eds-color-payments: #1D4ED8;     /* Corporate Royal Blue */
      --eds-color-balance: #0F766E;      /* Deep Teal Accent */
      
      --eds-radius-md: 8px;
      --eds-shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--eds-color-bg-main);
      font-family: var(--eds-font-sans);
      margin: 0;
      padding: 2.5rem 1.5rem;
      color: var(--eds-text-primary);
    }

    .eds-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* --- Container Card Setup --- */
    .eds-chart-card {
      background-color: var(--eds-color-surface);
      border: 1px solid var(--eds-color-border);
      border-radius: var(--eds-radius-md);
      box-shadow: var(--eds-shadow-sm);
      padding: 2rem;
    }

    .eds-chart-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 1.5rem 0;
      color: var(--eds-text-primary);
    }

    /* --- Legend Section --- */
    .eds-chart-legend {
      display: flex;
      gap: 2rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--eds-color-border);
    }

    .eds-legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--eds-text-muted);
    }

    .eds-legend-line {
      width: 24px;
      height: 3px;
      border-radius: 2px;
    }

    /* --- Chart Viewport Area --- */
    .eds-chart-workspace {
      position: relative;
      padding: 0 3.5rem 2.5rem 3.5rem; /* Space for Y-Axes and X-Axis labels */
      height: 360px;
    }

    /* --- Background Horizontal Y-Axis Lines --- */
    .eds-chart-grid-lines {
      position: absolute;
      top: 0;
      left: 3.5rem;
      right: 3.5rem;
      bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .eds-grid-line {
      width: 100%;
      height: 1px;
      background-color: var(--eds-color-grid-line);
      position: relative;
    }

    /* Left Y-Axis Values (Payments Received) */
    .eds-grid-line::before {
      content: attr(data-left-label);
      position: absolute;
      left: -3.5rem;
      top: -7px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--eds-text-muted);
      width: 2.75rem;
      text-align: right;
    }

    /* Right Y-Axis Values (Running Account Balance) */
    .eds-grid-line::after {
      content: attr(data-right-label);
      position: absolute;
      right: -3.5rem;
      top: -7px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--eds-text-muted);
      width: 2.75rem;
      text-align: left;
    }

    /* --- SVG Graphic Layer Viewport --- */
    .eds-chart-svg-viewport {
      position: absolute;
      top: 0;
      left: 3.5rem;
      right: 3.5rem;
      bottom: 2.5rem;
      width: calc(100% - 7rem);
      height: calc(100% - 2.5rem);
      overflow: visible;
    }

    /* Vector Trend Path Settings */
    .eds-trend-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eds-trend-line--payments {
      stroke: var(--eds-color-payments);
    }

    .eds-trend-line--balance {
      stroke: var(--eds-color-balance);
    }

    /* Data Coordinates Node Point */
    .eds-chart-node {
      fill: var(--eds-color-surface);
      stroke-width: 2;
      cursor: pointer;
      transition: r 0.1s ease;
    }

    .eds-chart-node:hover {
      r: 6px;
    }

    .eds-chart-node--payments { stroke: var(--eds-color-payments); }
    .eds-chart-node--balance { stroke: var(--eds-color-balance); }

    /* --- Timeline Horizontal X-Axis Text Wrapper --- */
    .eds-chart-x-axis {
      position: absolute;
      bottom: 0;
      left: 3.5rem;
      right: 3.5rem;
      display: flex;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid #94A3B8;
    }

    .eds-x-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--eds-text-muted);
      width: calc(100% / 12);
      text-align: center;
    }
  </style>
</head>
